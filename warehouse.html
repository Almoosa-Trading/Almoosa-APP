<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />


    <link rel="manifest" href="./manifest.json">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>سجلات المسح | إدارة المستودع الاحترافية</title>
    <!-- خط Cairo ورسومات FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-main: #f8fafc;
            --surface-card: #ffffff;
            --surface-hover: #f1f5f9;
            
            --brand-primary: #1d4ed8;
            --brand-light: #2563eb;
            --brand-soft: #eff6ff;
            --brand-border: #bfdbfe;
            
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            
            --text-main: #0f172a;
            --text-muted: #64748b;
            --text-subtle: #94a3b8;
            
            --border-main: #e2e8f0;
            --border-light: #f1f5f9;
            
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-xl: 20px;
            
            --shadow-card: 0 4px 20px -2px rgba(0, 0, 0, 0.05);
            --transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', system-ui, -apple-system, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-main);
            background-image: 
                radial-gradient(at 0% 0%, rgba(29, 78, 216, 0.04) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(16, 185, 129, 0.04) 0px, transparent 50%);
            background-attachment: fixed;
            color: var(--text-main);
            padding: 24px 16px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .dashboard-container {
            width: 100%;
            max-width: 580px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* ===== Header ===== */
        .app-header {
            background: var(--surface-card);
            padding: 16px 20px;
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-main);
            box-shadow: var(--shadow-card);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .brand-icon {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, var(--brand-primary), #1e40af);
            color: white;
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            box-shadow: 0 4px 12px rgba(29, 78, 216, 0.25);
        }

        .brand-info h1 {
            font-size: 16px;
            font-weight: 800;
            color: var(--text-main);
        }

        .brand-info p {
            font-size: 11px;
            color: var(--text-muted);
            font-weight: 600;
        }

        .header-actions {
            display: flex;
            gap: 8px;
        }

        .btn-icon {
            width: 40px;
            height: 40px;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-main);
            background: #f8fafc;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition);
            text-decoration: none;
            font-size: 14px;
        }

        .btn-icon:hover {
            background: var(--brand-primary);
            color: #ffffff;
            border-color: var(--brand-primary);
        }

        /* ===== Stats Banner ===== */
        .stats-card {
            background: var(--surface-card);
            border-radius: var(--radius-xl);
            padding: 22px 24px;
            border: 1px solid var(--border-main);
            box-shadow: var(--shadow-card);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        .stats-card::before {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 5px;
            height: 100%;
            background: linear-gradient(180deg, var(--brand-primary), var(--success));
        }

        .stats-content span {
            font-size: 11px;
            font-weight: 800;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .stats-content h2 {
            font-size: 34px;
            font-weight: 900;
            color: var(--brand-primary);
            line-height: 1.1;
            margin-top: 4px;
        }

        .stats-badge {
            background: #ecfdf5;
            border: 1px solid #a7f3d0;
            padding: 8px 14px;
            border-radius: 30px;
            font-size: 11px;
            font-weight: 800;
            color: var(--success);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* ===== Filter Panel ===== */
        .filter-card {
            background: var(--surface-card);
            border-radius: var(--radius-lg);
            padding: 20px;
            border: 1px solid var(--border-main);
            box-shadow: var(--shadow-card);
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .filter-section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .filter-section-title {
            font-size: 11px;
            font-weight: 800;
            color: var(--brand-light);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .reset-filter-btn {
            background: #fee2e2;
            border: 1px solid #fca5a5;
            color: #b91c1c;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: var(--transition);
        }

        .reset-filter-btn:hover {
            background: #fca5a5;
            color: #7f1d1d;
        }

        .preset-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        .preset-btn {
            background: #f8fafc;
            border: 1px solid var(--border-main);
            color: var(--text-muted);
            padding: 9px 4px;
            border-radius: var(--radius-sm);
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            text-align: center;
        }

        .preset-btn:hover {
            border-color: var(--brand-primary);
            color: var(--brand-light);
        }

        .preset-btn.active {
            background: var(--brand-primary);
            border-color: var(--brand-primary);
            color: white;
            box-shadow: 0 4px 12px rgba(29, 78, 216, 0.25);
        }

        .custom-range-box {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .date-input-wrapper {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .date-input-wrapper label {
            font-size: 10px;
            font-weight: 800;
            color: var(--text-muted);
        }

        .date-input-wrapper input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border-main);
            border-radius: var(--radius-sm);
            background: #f8fafc;
            font-size: 11px;
            font-weight: 700;
            color: var(--text-main);
            outline: none;
        }

        .date-input-wrapper input:focus {
            border-color: var(--brand-primary);
            background: #ffffff;
        }

        .search-field {
            position: relative;
        }

        .search-field input {
            width: 100%;
            padding: 12px 42px 12px 16px;
            background: #f8fafc;
            border: 1px solid var(--border-main);
            border-radius: var(--radius-md);
            font-size: 12px;
            font-weight: 700;
            color: var(--text-main);
            outline: none;
        }

        .search-field input::placeholder {
            color: var(--text-subtle);
        }

        .search-field input:focus {
            border-color: var(--brand-primary);
            background: #ffffff;
        }

        .search-field i {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-subtle);
        }

        .active-filter-bar {
            background: var(--brand-soft);
            border: 1px solid var(--brand-border);
            padding: 10px 14px;
            border-radius: var(--radius-sm);
            font-size: 11px;
            color: var(--brand-light);
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        /* ===== List Section ===== */
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .section-header h3 {
            font-size: 14px;
            font-weight: 800;
            color: var(--text-main);
        }

        .doc-badge {
            background: var(--surface-card);
            border: 1px solid var(--border-main);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 800;
            color: var(--brand-light);
        }

        /* Entry Cards */
        .doc-card {
            background: var(--surface-card);
            border-radius: var(--radius-lg);
            padding: 20px;
            border: 1px solid var(--border-main);
            box-shadow: var(--shadow-card);
            margin-bottom: 14px;
            transition: var(--transition);
        }

        .doc-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 12px;
            margin-bottom: 12px;
            border-bottom: 1px solid var(--border-main);
        }

        .doc-date-chip {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            font-weight: 800;
            color: var(--text-main);
        }

        .doc-date-chip i {
            color: var(--brand-light);
        }

        .day-total-tag {
            background: var(--brand-soft);
            color: var(--brand-light);
            border: 1px solid var(--brand-border);
            font-size: 11px;
            font-weight: 800;
            padding: 4px 12px;
            border-radius: var(--radius-sm);
        }

        .supervisor-tag {
            font-size: 11px;
            color: var(--text-muted);
            font-weight: 700;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Performance List Item */
        .emp-row {
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 12px 0;
            border-top: 1px dashed var(--border-main);
        }

        .emp-main-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .emp-name-box {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            font-weight: 700;
            color: var(--text-main);
        }

        .emp-avatar {
            width: 32px;
            height: 32px;
            background: var(--brand-soft);
            border: 1px solid var(--brand-border);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--brand-primary);
            font-size: 12px;
        }

        .emp-stats-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .count-badge {
            background: #f8fafc;
            border: 1px solid var(--border-main);
            color: var(--text-main);
            padding: 4px 10px;
            border-radius: 6px;
            font-weight: 800;
            font-size: 12px;
        }

        .kpi-pill {
            font-size: 10px;
            font-weight: 800;
            padding: 3px 8px;
            border-radius: 4px;
        }

        .kpi-high { background: #d1fae5; color: #047857; border: 1px solid #a7f3d0; }
        .kpi-mid { background: #fef3c7; color: #b45309; border: 1px solid #fde68a; }
        .kpi-low { background: #fee2e2; color: #b91c1c; border: 1px solid #fca5a5; }

        .kpi-bar-wrapper {
            width: 100%;
            height: 6px;
            background: #f1f5f9;
            border-radius: 10px;
            overflow: hidden;
            display: flex;
        }

        .kpi-bar-fill {
            height: 100%;
            border-radius: 10px;
            transition: width 0.5s ease;
        }

        /* Loading & Empty States */
        .state-container {
            text-align: center;
            padding: 50px 20px;
            background: var(--surface-card);
            border-radius: var(--radius-lg);
            border: 1px dashed var(--border-main);
            color: var(--text-muted);
        }

        .state-container i {
            font-size: 36px;
            color: var(--brand-light);
            margin-bottom: 12px;
        }

        footer {
            text-align: center;
            margin-top: 10px;
            padding-bottom: 20px;
            font-size: 11px;
            color: var(--text-subtle);
            font-weight: 700;
        }
    </style>
</head>
<body>

<div class="dashboard-container">
    <!-- Header -->
    <header class="app-header">
        <div class="header-brand">
            <div class="brand-icon">
                <i class="fa-solid fa-chart-line"></i>
            </div>
            <div class="brand-info">
                <h1>إدارة المستودع</h1>
                <p>سجلات المسح ومؤشرات الأداء (KPI)</p>
            </div>
        </div>
        <div class="header-actions">
            <button class="btn-icon" onclick="fetchScanEntries()" title="تحديث البيانات">
                <i class="fa-solid fa-rotate-right"></i>
            </button>
            <a href="index.html" class="btn-icon" title="الرئيسية">
                <i class="fa-solid fa-house"></i>
            </a>
        </div>
    </header>

    <!-- Summary Stats Banner -->
    <div class="stats-card">
        <div class="stats-content">
            <span>إجمالي القطع الممسوحة</span>
            <h2 id="totalItemsCount">0</h2>
        </div>
        <div class="stats-badge">
            <i class="fa-solid fa-circle-check"></i>
            <span>معتمدة (Submitted)</span>
        </div>
    </div>

    <!-- Filter Control Panel -->
    <div class="filter-card">
        <!-- ترويسة الفلتر مع زر إلغاء الفلاتر -->
        <div class="filter-section-header">
            <div class="filter-section-title">
                <i class="fa-solid fa-sliders"></i>
                <span>تصفية حسب التاريخ والبحث</span>
            </div>
            <button class="reset-filter-btn" onclick="resetAllFilters()" title="إلغاء وتصفير كل الفلاتر">
                <i class="fa-solid fa-rotate-left"></i> إلغاء الفلتر
            </button>
        </div>

        <div class="preset-grid">
            <button class="preset-btn" onclick="setDatePreset('today')">اليوم</button>
            <button class="preset-btn" onclick="setDatePreset('yesterday')">أمس</button>
            <button class="preset-btn" onclick="setDatePreset('week')">الأسبوع</button>
            <button class="preset-btn active" id="monthPresetBtn" onclick="setDatePreset('month')">الشهر الحالي</button>
        </div>

        <div class="custom-range-box">
            <div class="date-input-wrapper">
                <label>من تاريخ</label>
                <input type="date" id="startDateInput" onchange="handleCustomDateChange()">
            </div>
            <div class="date-input-wrapper">
                <label>إلى تاريخ</label>
                <input type="date" id="endDateInput" onchange="handleCustomDateChange()">
            </div>
        </div>

        <div class="active-filter-bar">
            <span id="filterDescriptionText">نطاق الفلتر: الشهر الحالي</span>
            <i class="fa-solid fa-filter" style="font-size: 11px;"></i>
        </div>

        <div class="search-field">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="searchInput" onkeyup="filterEntries()" oninput="filterEntries()" placeholder="ابحث باسم الموظف...">
        </div>
    </div>

    <!-- Records Section Header -->
    <div class="section-header">
        <h3>سجلات اليوم ومؤشر مساهمة الموظف</h3>
        <span class="doc-badge" id="docCountBadge">0 مستند</span>
    </div>

    <!-- Dynamic Container -->
    <div id="entriesContainer">
        <div class="state-container">
            <i class="fa-solid fa-circle-notch fa-spin"></i>
            <p>جاري تحميل البيانات ومؤشرات الأداء...</p>
        </div>
    </div>

    <footer>
        نظام إدارة المستودعات الذكي © 2026
    </footer>
</div>

<script>
    const CONFIG = {
        serverUrl: "https://87-237-225-155.nip.io",
        apiKey: "6f039a5a6130b79",
        apiSecret: "9e6d920a8fda252"
    };

    let cacheDocs = [];
    let currentFilterMode = 'month';

    document.addEventListener('DOMContentLoaded', () => {
        fetchScanEntries();
    });

    function formatDateISO(dateObj) {
        const year = dateObj.getFullYear();
        const month = String(dateObj.getMonth() + 1).padStart(2, '0');
        const day = String(dateObj.getDate()).padStart(2, '0');
        return `${year}-${month}-${day}`;
    }

    function extractDocDate(doc) {
        if (!doc) return '';
        let rawScanDate = doc.scan_date || doc.date || doc.posting_date || doc.creation || '';
        if (rawScanDate && rawScanDate.includes(' ')) {
            rawScanDate = rawScanDate.split(' ')[0];
        }
        return rawScanDate;
    }

    function setDatePreset(mode) {
        currentFilterMode = mode;
        
        document.querySelectorAll('.preset-btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById('startDateInput').value = '';
        document.getElementById('endDateInput').value = '';

        const today = new Date();
        const displayText = document.getElementById('filterDescriptionText');

        if (mode === 'today') {
            if (event && event.target) event.target.classList.add('active');
            displayText.textContent = `نطاق الفلتر: اليوم (${formatDateISO(today)})`;
        } else if (mode === 'yesterday') {
            if (event && event.target) event.target.classList.add('active');
            const yesterday = new Date();
            yesterday.setDate(today.getDate() - 1);
            displayText.textContent = `نطاق الفلتر: يوم أمس (${formatDateISO(yesterday)})`;
        } else if (mode === 'week') {
            if (event && event.target) event.target.classList.add('active');
            displayText.textContent = `نطاق الفلتر: آخر 7 أيام`;
        } else if (mode === 'month') {
            document.getElementById('monthPresetBtn').classList.add('active');
            displayText.textContent = `نطاق الفلتر: الشهر الحالي`;
        }

        filterEntries();
    }

    function handleCustomDateChange() {
        const start = document.getElementById('startDateInput').value;
        const end = document.getElementById('endDateInput').value;

        if (start || end) {
            currentFilterMode = 'custom';
            document.querySelectorAll('.preset-btn').forEach(btn => btn.classList.remove('active'));
            
            const textDisplay = document.getElementById('filterDescriptionText');
            if (start && end) textDisplay.textContent = `نطاق مخصص: من ${start} إلى ${end}`;
            else if (start) textDisplay.textContent = `نطاق مخصص: بدءاً من ${start}`;
            else if (end) textDisplay.textContent = `نطاق مخصص: حتى ${end}`;
            
            filterEntries();
        }
    }

    function resetAllFilters() {
        // 1. تفريغ خانة البحث
        document.getElementById('searchInput').value = '';

        // 2. تفريغ مدخلات التاريخ المخصصة
        document.getElementById('startDateInput').value = '';
        document.getElementById('endDateInput').value = '';

        // 3. إلغاء تفعيل الأزرار السريعة
        document.querySelectorAll('.preset-btn').forEach(btn => btn.classList.remove('active'));

        // 4. ضبط النمط لعرض كافة السجلات
        currentFilterMode = 'all';
        document.getElementById('filterDescriptionText').textContent = 'نطاق الفلتر: جميع السجلات (بدون قيود)';

        // 5. تطبيق التغييرات
        filterEntries();
    }

    async function fetchScanEntries() {
        const container = document.getElementById('entriesContainer');
        container.innerHTML = `
            <div class="state-container">
                <i class="fa-solid fa-circle-notch fa-spin"></i>
                <p>جاري مزامنة السجلات وحساب الأداء...</p>
            </div>`;

        try {
            const filters = JSON.stringify([["docstatus", "=", 1]]);
            const url = `${CONFIG.serverUrl}/api/resource/Employee Scan Entry?filters=${encodeURIComponent(filters)}&limit_page_length=200&order_by=scan_date asc`;

            const resList = await fetch(url, {
                headers: { "Authorization": `token ${CONFIG.apiKey}:${CONFIG.apiSecret}` }
            });

            if (!resList.ok) throw new Error("فشل جلب قائمة المستندات");

            const listData = await resList.json();
            const docsList = listData.data || [];

            if (docsList.length === 0) {
                container.innerHTML = `
                    <div class="state-container">
                        <i class="fa-solid fa-folder-open"></i>
                        <p>لا توجد سجلات مسح معتمدة (Submitted)</p>
                    </div>`;
                return;
            }

            cacheDocs = await Promise.all(docsList.map(async (doc) => {
                const resDoc = await fetch(`${CONFIG.serverUrl}/api/resource/Employee Scan Entry/${encodeURIComponent(doc.name)}`, {
                    headers: { "Authorization": `token ${CONFIG.apiKey}:${CONFIG.apiSecret}` }
                });
                if (resDoc.ok) {
                    const data = await resDoc.json();
                    return data.data;
                }
                return null;
            }));

            cacheDocs = cacheDocs.filter(d => d !== null);
            filterEntries();

        } catch (err) {
            console.error(err);
            container.innerHTML = `
                <div class="state-container" style="border-color: #ef4444;">
                    <i class="fa-solid fa-triangle-exclamation" style="color: #ef4444;"></i>
                    <p style="color: #dc2626;">تعذر الاتصال بالسيرفر. تحقق من إعدادات الشبكة.</p>
                </div>`;
        }
    }

    function renderDocs(docs, searchQuery = '') {
        const container = document.getElementById('entriesContainer');
        container.innerHTML = '';

        let totalScannedAll = 0;
        document.getElementById('docCountBadge').textContent = `${docs.length} مستند`;

        if (docs.length === 0) {
            container.innerHTML = `
                <div class="state-container">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <p>لا توجد نتائج مطابقة لشروط الفلترة أو البحث</p>
                </div>`;
            document.getElementById('totalItemsCount').textContent = '0';
            return;
        }

        docs.forEach(doc => {
            const rawDate = extractDocDate(doc);
            const docDate = rawDate || 'بدون تاريخ';
            const supervisor = (doc.supervisor !== undefined && doc.supervisor !== null) ? doc.supervisor : 'غير محدد';
            const scans = doc.employee_scans || [];

            let dayTotal = 0;
            scans.forEach(r => dayTotal += Number(r.scanned_items || 0));
            totalScannedAll += dayTotal;

            const avgItems = scans.length > 0 ? (dayTotal / scans.length) : 0;
            let rowsHtml = '';

            scans.forEach(row => {
                const empName = row.employee_name || row.employee || 'غير معرف';
                
                if (searchQuery) {
                    const matchName = empName.toLowerCase().includes(searchQuery);
                    const matchCode = (row.employee || '').toLowerCase().includes(searchQuery);
                    if (!matchName && !matchCode) return;
                }

                const itemsCount = Number(row.scanned_items || 0);
                const sharePercent = dayTotal > 0 ? Math.round((itemsCount / dayTotal) * 100) : 0;

                let kpiBadge = '';
                let barColor = '';
                if (itemsCount >= avgItems * 1.15) {
                    kpiBadge = `<span class="kpi-pill kpi-high"><i class="fa-solid fa-arrow-up"></i> أداء ممتاز</span>`;
                    barColor = 'var(--success)';
                } else if (itemsCount >= avgItems * 0.85) {
                    kpiBadge = `<span class="kpi-pill kpi-mid"><i class="fa-solid fa-minus"></i> أداء جيد</span>`;
                    barColor = 'var(--warning)';
                } else {
                    kpiBadge = `<span class="kpi-pill kpi-low"><i class="fa-solid fa-arrow-down"></i> أقل من المتوسط</span>`;
                    barColor = 'var(--danger)';
                }

                rowsHtml += `
                    <div class="emp-row">
                        <div class="emp-main-info">
                            <div class="emp-name-box">
                                <div class="emp-avatar"><i class="fa-solid fa-user"></i></div>
                                <span>${empName}</span>
                            </div>
                            <div class="emp-stats-right">
                                ${kpiBadge}
                                <span class="count-badge">${itemsCount} قطعة (${sharePercent}%)</span>
                            </div>
                        </div>
                        <div class="kpi-bar-wrapper">
                            <div class="kpi-bar-fill" style="width: ${sharePercent}%; background: ${barColor};"></div>
                        </div>
                    </div>
                `;
            });

            if (rowsHtml === '' && searchQuery) return;

            const card = document.createElement('div');
            card.className = 'doc-card';
            card.innerHTML = `
                <div class="doc-card-header">
                    <div class="doc-date-chip">
                        <i class="fa-solid fa-calendar-day"></i>
                        <span>${docDate}</span>
                    </div>
                    <div class="day-total-tag">إجمالي اليوم: ${dayTotal.toLocaleString('ar-SA')} قطعة</div>
                </div>
                <div class="supervisor-tag">
                    <i class="fa-solid fa-user-tie"></i>
                    <span>المشرف المسئول: ${supervisor}</span>
                </div>
                <div>
                    ${rowsHtml || '<div style="text-align:center; color: var(--text-muted); font-size: 12px; padding: 10px;">لا توجد تفاصيل موظفين</div>'}
                </div>
            `;
            container.appendChild(card);
        });

        document.getElementById('totalItemsCount').textContent = totalScannedAll.toLocaleString('ar-SA');
    }

    function filterEntries() {
        const query = (document.getElementById('searchInput').value || '').toLowerCase().trim();
        const today = new Date();
        const todayISO = formatDateISO(today);

        const startDateVal = document.getElementById('startDateInput').value;
        const endDateVal = document.getElementById('endDateInput').value;

        const filtered = cacheDocs.filter(doc => {
            if (doc.docstatus !== 1) return false;

            const docDate = extractDocDate(doc);
            let dateMatch = true;

            if (currentFilterMode === 'all') {
                dateMatch = true; // إلغاء قيد التاريخ لعرض الجميع
            } else if (currentFilterMode === 'today') {
                dateMatch = (docDate === todayISO);
            } else if (currentFilterMode === 'yesterday') {
                const yest = new Date();
                yest.setDate(today.getDate() - 1);
                dateMatch = (docDate === formatDateISO(yest));
            } else if (currentFilterMode === 'week') {
                const sevenDaysAgo = new Date();
                sevenDaysAgo.setDate(today.getDate() - 7);
                dateMatch = (docDate >= formatDateISO(sevenDaysAgo) && docDate <= todayISO);
            } else if (currentFilterMode === 'month') {
                const currentMonthPrefix = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}`;
                dateMatch = docDate.startsWith(currentMonthPrefix);
            } else if (currentFilterMode === 'custom') {
                if (startDateVal && endDateVal) dateMatch = (docDate >= startDateVal && docDate <= endDateVal);
                else if (startDateVal) dateMatch = (docDate >= startDateVal);
                else if (endDateVal) dateMatch = (docDate <= endDateVal);
            }

            let searchMatch = true;
            if (query) {
                searchMatch = (doc.employee_scans || []).some(row => {
                    const name = (row.employee_name || '').toLowerCase();
                    const code = (row.employee || '').toLowerCase();
                    return name.includes(query) || code.includes(query);
                });
            }

            return dateMatch && searchMatch;
        });

        // ترتيب النتائج تصاعدياً بناءً على التاريخ (من الأقدم إلى الأحدث)
        filtered.sort((a, b) => {
            const dateA = new Date(extractDocDate(a) || '1970-01-01');
            const dateB = new Date(extractDocDate(b) || '1970-01-01');
            return dateB - dateA;
        });

        renderDocs(filtered, query);
    }
</script>

<script>
    // التأكد من إبقاء التنقل كاملاً داخل الـ PWA Standalone Mode
    document.addEventListener("click", function(e) {
        var anchor = e.target.closest("a");
        if (anchor && anchor.href) {
            var targetUrl = new URL(anchor.href, window.location.href);
            // إذا كان الرابط تابعاً لنفس الموقع ولم يُفتح في تبويب جديد
            if (targetUrl.origin === window.location.origin && anchor.target !== "_blank") {
                e.preventDefault();
                window.location.assign(anchor.href);
            }
        }
    }, true);
</script>





<!-- زر تحديث التطبيق إلى أحدث نسخة -->
<script>
    // 1. دالة التحديث الشاملة عند الضغط على زر التحديث أو استدعائها
    async function forceAppUpdate() {
        if ('serviceWorker' in navigator) {
            try {
                // إلغاء تسجيل جميع الـ Service Workers المسجلة
                const registrations = await navigator.serviceWorker.getRegistrations();
                for (let registration of registrations) {
                    await registration.unregister();
                }
            } catch (err) {
                console.error("خطأ أثناء إلغاء Service Worker:", err);
            }
        }

        // مسح جميع أنواع Cache المخزنة في المتصفح
        if ('caches' in window) {
            try {
                const keys = await caches.keys();
                await Promise.all(keys.map(key => caches.delete(key)));
            } catch (err) {
                console.error("خطأ أثناء مسح الكاش:", err);
            }
        }

        // إعادة تحميل الصفحة القسرية مع إضافة وقت للتأكد من عدم جلب التخزين القديم
        const cleanUrl = window.location.origin + window.location.pathname + '?v=' + new Date().getTime();
        window.location.href = cleanUrl;
    }

    // 2. تحديث زر التحديث 🔄 في أعلى الصفحة ليدعو دالة التحديث
    document.addEventListener('DOMContentLoaded', () => {
        const updateBtn = document.querySelector('.header-left-group .action-btn[title="تحديث"]');
        if (updateBtn) {
            updateBtn.setAttribute('onclick', 'forceAppUpdate()');
        }
    });
</script>
