<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlRoot">
<head>
    <link rel="manifest" href="./manifest.json">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title data-i18n="page_title">إدارة المستودع - الموسى التجارية</title>
    
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        /* الألوان والمتغيرات للوضع النهاري والليلي */
        :root {
            --bg-body: #f8fafc;
            --bg-card: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --accent: #2563eb;
            --accent-light: #eff6ff;
            --primary: #0f172a;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --radius: 14px;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        [data-theme="dark"] {
            --bg-body: #090d16;
            --bg-card: #111827;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #1f2937;
            --accent: #3b82f6;
            --accent-light: #1e3a8a;
            --primary: #1e293b;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            font-family: 'Cairo', sans-serif;
            padding: 10px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            transition: background 0.3s, color 0.3s;
        }

        .mobile-container {
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding: 14px 16px;
            background: var(--bg-card);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }

        .header-title-box h1 {
            font-size: 15px;
            color: var(--text-main);
            font-weight: 800;
            line-height: 1.2;
        }

        .header-title-box p {
            font-size: 10px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .header-left-group {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .action-btn, .lang-select {
            height: 32px;
            padding: 0 8px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--bg-body);
            color: var(--text-main);
            font-size: 11px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            text-decoration: none;
            outline: none;
        }

        .hero-metric-card {
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            color: white;
            border-radius: var(--radius);
            padding: 16px 18px;
            margin-bottom: 12px;
            box-shadow: 0 10px 20px -5px rgba(37, 99, 235, 0.3);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .hero-metric-info span {
            font-size: 11px;
            color: #dbeafe;
            font-weight: 600;
            display: block;
        }

        .hero-metric-info h2 {
            font-size: 24px;
            font-weight: 900;
            margin-top: 4px;
            color: #ffffff;
        }

        .hero-metric-icon {
            width: 45px;
            height: 45px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .btn-mr-banner {
            width: 100%;
            height: 44px;
            background: linear-gradient(135deg, #059669 0%, #047857 100%);
            color: white;
            border: none;
            border-radius: var(--radius);
            font-size: 12px;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            box-shadow: 0 6px 15px rgba(5, 150, 105, 0.25);
            margin-bottom: 12px;
        }

        .filter-panel {
            background: var(--bg-card);
            padding: 12px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            margin-bottom: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            border: 1px solid var(--border);
        }

        .period-chips {
            display: flex;
            width: 100%;
            gap: 4px;
        }

        .chip {
            flex: 1;
            background: var(--bg-body);
            border: 1px solid var(--border);
            padding: 8px 0;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 800;
            text-align: center;
            cursor: pointer;
            color: var(--text-muted);
            transition: all 0.2s;
        }

        .chip.active {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        .search-field {
            position: relative;
        }

        .search-field input {
            width: 100%;
            padding: 9px 35px 9px 12px;
            background: var(--bg-body);
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 11px;
            outline: none;
            color: var(--text-main);
            font-weight: 600;
        }

        .search-field i {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 12px;
        }

        .chart-box {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 14px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            margin-bottom: 12px;
        }

        .chart-title {
            font-size: 11px;
            font-weight: 800;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--text-main);
        }

        .chart-container {
            position: relative;
            width: 100%;
            height: 150px;
        }

        .doc-card {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 12px 14px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            margin-bottom: 10px;
            border-right: 4px solid var(--accent);
        }

        .doc-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 6px;
            margin-bottom: 6px;
            border-bottom: 1px solid var(--border);
        }

        .doc-date {
            font-size: 11px;
            font-weight: 800;
            color: var(--text-main);
        }

        .doc-total {
            background: var(--accent-light);
            color: var(--accent);
            font-size: 10px;
            font-weight: 800;
            padding: 2px 6px;
            border-radius: 6px;
        }

        .emp-row {
            display: flex;
            flex-direction: column;
            gap: 3px;
            padding: 5px 0;
            border-top: 1px dashed var(--border);
        }

        .emp-info {
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            font-weight: 700;
            color: var(--text-main);
        }

        .kpi-bar {
            height: 4px;
            background: var(--border);
            border-radius: 4px;
            overflow: hidden;
            display: flex;
        }

        .kpi-fill {
            height: 100%;
            border-radius: 4px;
        }

        /* Modal طلبات المواد */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(15, 23, 42, 0.75);
            z-index: 1000;
            display: none;
            justify-content: center;
            align-items: flex-end;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-box {
            background: var(--bg-card);
            width: 100%;
            max-width: 480px;
            max-height: 85vh;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 -10px 25px rgba(0,0,0,0.3);
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        .modal-header {
            padding: 12px 16px;
            background: var(--primary);
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h2 {
            font-size: 12px;
            font-weight: 800;
        }

        .modal-close {
            background: none;
            border: none;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .modal-body {
            padding: 12px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
        }

        .stats-card {
            background: var(--bg-body);
            border-radius: 8px;
            padding: 8px;
            border: 1px solid var(--border);
            text-align: center;
        }

        .stats-card span {
            font-size: 9px;
            font-weight: 700;
            color: var(--text-muted);
            display: block;
        }

        .stats-card h2 {
            font-size: 13px;
            font-weight: 900;
            margin-top: 2px;
        }

        .branch-summary-card {
            background: var(--bg-body);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .branch-card-title {
            font-size: 11px;
            font-weight: 800;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 6px;
            border-bottom: 1px dashed var(--border);
            padding-bottom: 4px;
        }

        .branch-values-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 4px;
            text-align: center;
        }

        .branch-val-box {
            background: var(--bg-card);
            padding: 6px 4px;
            border-radius: 6px;
            border: 1px solid var(--border);
        }

        .branch-val-box span {
            font-size: 9px;
            font-weight: 700;
            color: var(--text-muted);
            display: block;
        }

        .branch-val-box strong {
            font-size: 11px;
            font-weight: 900;
        }
    </style>
</head>
<body data-theme="light">

<div class="mobile-container">
    <!-- الهيدر العلوي -->
    <header>
        <div class="header-title-box">
            <h1 data-i18n="app_title">إدارة المستودع</h1>
            <p data-i18n="app_subtitle">سجلات المسح</p>
        </div>
        <div class="header-left-group">
            <!-- زر الوضع الليلي -->
            <button class="action-btn" id="themeToggleBtn" onclick="toggleTheme()" title="تغيير المظهر">
                <i class="fa-solid fa-moon" id="themeIcon"></i>
            </button>
            <select id="langSelect" class="lang-select" onchange="changeLanguage(this.value)">
                <option value="ar">AR</option>
                <option value="en">EN</option>
                <option value="hi">HI</option>
                <option value="ur">UR</option>
            </select>
            <button class="action-btn" onclick="fetchScanEntries()" title="تحديث">🔄</button>
            <a href="index.html" class="action-btn" title="الرئيسية">🏠</a>
        </div>
    </header>

    <!-- إحصائية الممسوح الكلي -->
    <div class="hero-metric-card">
        <div class="hero-metric-info">
            <span data-i18n="total_scanned">إجمالي القطع الممسوحة</span>
            <h2 id="totalItemsCount">0</h2>
        </div>
        <div class="hero-metric-icon">
            <i class="fa-solid fa-boxes-stacked"></i>
        </div>
    </div>

    <!-- زر طلبات المواد (MR) البارز -->
    <button class="btn-mr-banner" onclick="openMRModal()">
        <i class="fa-solid fa-truck-ramp-box"></i>
        <span data-i18n="mr_button">عرض طلبات المواد (MR) حسب الفروع</span>
    </button>

    <!-- الفلتر والبحث -->
    <div class="filter-panel">
        <div class="period-chips">
            <button class="chip" onclick="setDatePreset('today')" data-i18n="preset_today">اليوم</button>
            <button class="chip" onclick="setDatePreset('yesterday')" data-i18n="preset_yesterday">أمس</button>
            <button class="chip" onclick="setDatePreset('week')" data-i18n="preset_week">الأسبوع</button>
            <button class="chip active" id="monthPresetBtn" onclick="setDatePreset('month')" data-i18n="preset_month">الشهر</button>
            <button class="chip" onclick="setDatePreset('all')" data-i18n="preset_all">الكل</button>
        </div>

        <div class="search-field">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="searchInput" onkeyup="filterEntries()" data-i18n-placeholder="search_placeholder" placeholder="ابحث باسم الموظف...">
        </div>
    </div>

    <!-- الرسم البياني للأداء -->
    <div class="chart-box">
        <div class="chart-title">
            <i class="fa-solid fa-chart-column" style="color:var(--accent);"></i> 
            <span data-i18n="chart_title">أداء الموظفين هذا الشهر</span>
        </div>
        <div class="chart-container">
            <canvas id="employeeScanChart"></canvas>
        </div>
    </div>

    <!-- السجلات -->
    <div id="entriesContainer">
        <div style="text-align:center; padding: 25px; color: var(--text-muted); font-size: 11px; font-weight: 700;" data-i18n="loading">جاري تحميل البيانات...</div>
    </div>
</div>

<!-- Modal طلبات المواد -->
<div class="modal-overlay" id="mrModal">
    <div class="modal-box">
        <div class="modal-header">
            <h2 data-i18n="mr_modal_title">إجمالي طلبات المواد حسب الفروع</h2>
            <button class="modal-close" onclick="closeMRModal()"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="modal-body">
            <div class="metrics-grid">
                <div class="stats-card">
                    <span data-i18n="card_required">المطلوب</span>
                    <h2 id="mrTotalQty" style="color:var(--danger);">0</h2>
                </div>
                <div class="stats-card">
                    <span data-i18n="card_transferred">المحول</span>
                    <h2 id="mrTransferredQty" style="color:var(--success);">0</h2>
                </div>
                <div class="stats-card">
                    <span data-i18n="card_pending">المتبقي</span>
                    <h2 id="mrPendingQty" style="color:var(--warning);">0</h2>
                </div>
            </div>

            <div class="period-chips">
                <button class="chip" onclick="setMRDatePreset('today', this)" data-i18n="preset_today">اليوم</button>
                <button class="chip" onclick="setMRDatePreset('yesterday', this)" data-i18n="preset_yesterday">أمس</button>
                <button class="chip" onclick="setMRDatePreset('week', this)" data-i18n="preset_week">الأسبوع</button>
                <button class="chip active" onclick="setMRDatePreset('month', this)" data-i18n="preset_month">الشهر</button>
                <button class="chip" onclick="setMRDatePreset('all', this)" data-i18n="preset_all">الكل</button>
            </div>

            <div class="branch-summary-list" id="branchSummaryList" style="display:flex; flex-direction:column; gap:6px;">
                <div style="text-align:center; padding:15px; font-size:11px; color:var(--text-muted); font-weight:700;" data-i18n="loading_branches">جاري تجميع بيانات الفروع...</div>
            </div>
        </div>
    </div>
</div>

<script>
    // قاموس الترجمات الشامل
    const translations = {

            preset_month: "Month",
            preset_all: "All",
            search_placeholder: "Search employee...",
            chart_title: "Employee Performance",
            loading: "Loading data...",
            mr_modal_title: "MR Totals by Branch",
            card_required: "Required",

        },

            no_records: "کوئی ریکارڈ نہیں",
            no_mr: "کوئی مواد کی درخواست نہیں ملی۔"
        }
    };

    let currentLang = localStorage.getItem('app_lang') || 'ar';

    function setLanguage(lang) {
        currentLang = lang;
        localStorage.setItem('app_lang', lang);
        const root = document.getElementById('htmlRoot');
        root.setAttribute('lang', lang);
        root.setAttribute('dir', (lang === 'ar' || lang === 'ur') ? 'rtl' : 'ltr');
        
        const selectEl = document.getElementById('langSelect');
        if (selectEl) selectEl.value = lang;

        document.querySelectorAll('[data-i18n]').forEach(el => {
            const key = el.getAttribute('data-i18n');
            if (translations[lang] && translations[lang][key]) {
                el.textContent = translations[lang][key];
            }
        });

        document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
            const key = el.getAttribute('data-i18n-placeholder');
            if (translations[lang] && translations[lang][key]) {
                el.placeholder = translations[lang][key];
            }
        });
    }

    function changeLanguage(lang) {
        setLanguage(lang);
        filterEntries();
        if(cacheMRDocs.length > 0) filterMRData();
    }

    // وظيفة الوضع الليلي المستقلة والمضمونة
    function toggleTheme() {
        const currentTheme = document.documentElement.getAttribute('data-theme') || localStorage.getItem('app_theme') || 'light';
        const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
        
        document.documentElement.setAttribute('data-theme', newTheme);
        document.body.setAttribute('data-theme', newTheme);
        localStorage.setItem('app_theme', newTheme);
        
        const themeIcon = document.getElementById('themeIcon');
        if (themeIcon) {
            themeIcon.className = newTheme === 'dark' ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        setLanguage(currentLang);
        const savedTheme = localStorage.getItem('app_theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);
        document.body.setAttribute('data-theme', savedTheme);
        const themeIcon = document.getElementById('themeIcon');
        if (themeIcon) {
            themeIcon.className = savedTheme === 'dark' ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
        }
        fetchScanEntries();
    });

    const CONFIG = {
        serverUrl: "https://87-237-225-155.nip.io",
        apiKey: "6f039a5a6130b79",
        apiSecret: "9e6d920a8fda252"
    };

    let cacheDocs = [];
    let currentFilterMode = 'month';
    let empChartInstance = null;

    function formatDateISO(dateObj) {
        const year = dateObj.getFullYear();
        const month = String(dateObj.getMonth() + 1).padStart(2, '0');
        const day = String(dateObj.getDate()).padStart(2, '0');
        return `${year}-${month}-${day}`;
    }

    function extractDocDate(doc) {
        if (!doc) return '';
        let d = doc.scan_date || doc.date || doc.posting_date || doc.creation || '';
        return d.includes(' ') ? d.split(' ')[0] : d;
    }

    function setDatePreset(mode) {
        currentFilterMode = mode;
        document.querySelectorAll('.filter-panel .chip').forEach(btn => btn.classList.remove('active'));
        if (event && event.target) event.target.classList.add('active');
        filterEntries();
    }

    async function fetchScanEntries() {
        const container = document.getElementById('entriesContainer');
        try {
            const filters = JSON.stringify([["docstatus", "=", 1]]);
            const url = `${CONFIG.serverUrl}/api/resource/Employee Scan Entry?filters=${encodeURIComponent(filters)}&limit_page_length=2000&order_by=scan_date asc`;
            const res = await fetch(url, { headers: { "Authorization": `token ${CONFIG.apiKey}:${CONFIG.apiSecret}` } });
            const listData = await res.json();
            const docsList = listData.data || [];

            cacheDocs = await Promise.all(docsList.map(async (doc) => {
                const resDoc = await fetch(`${CONFIG.serverUrl}/api/resource/Employee Scan Entry/${encodeURIComponent(doc.name)}`, {
                    headers: { "Authorization": `token ${CONFIG.apiKey}:${CONFIG.apiSecret}` }
                });
                return resDoc.ok ? (await resDoc.json()).data : null;
            }));

            cacheDocs = cacheDocs.filter(d => d !== null);
            filterEntries();
        } catch (err) {
            container.innerHTML = `<div style="text-align:center; color:red; font-size:11px;">خطأ بالاتصال بالسيرفر</div>`;
        }
    }

    function renderDocs(docs, searchQuery = '') {
        const container = document.getElementById('entriesContainer');
        container.innerHTML = '';
        let totalScanned = 0;
        let empTotals = {};

        if (docs.length === 0) {
            container.innerHTML = `<div style="text-align:center; padding:25px; color:var(--text-muted); font-size:11px; font-weight:700;">${translations[currentLang]?.no_records || 'لا توجد سجلات'}</div>`;
            document.getElementById('totalItemsCount').textContent = '0';
            renderChart([], []);
            return;
        }

        docs.sort((a, b) => new Date(extractDocDate(b)) - new Date(extractDocDate(a)));

        docs.forEach(doc => {
            const scans = doc.employee_scans || [];
            let dayTotal = 0;
            scans.forEach(r => dayTotal += Number(r.scanned_items || 0));
            totalScanned += dayTotal;

            let rowsHtml = '';
            scans.forEach(row => {
                const empName = row.employee_name || 'غير معروف';
                if (searchQuery && !empName.toLowerCase().includes(searchQuery)) return;

                const count = Number(row.scanned_items || 0);
                empTotals[empName] = (empTotals[empName] || 0) + count;
                const percent = dayTotal > 0 ? Math.round((count / dayTotal) * 100) : 0;

                let fillColor = '#2563eb';
                if (percent >= 40) fillColor = '#10b981';
                else if (percent >= 20) fillColor = '#f59e0b';
                else fillColor = '#ef4444';

                rowsHtml += `
                    <div class="emp-row">
                        <div class="emp-info">
                            <span>${empName}</span>
                            <span>Pcs (${percent}%) ${count.toLocaleString('en-US')}</span>
                        </div>
                        <div class="kpi-bar">
                            <div class="kpi-fill" style="width:${percent}%; background:${fillColor};"></div>
                        </div>
                    </div>
                `;
            });

            if (rowsHtml === '' && searchQuery) return;

            const card = document.createElement('div');
            card.className = 'doc-card';
            card.innerHTML = `
                <div class="doc-card-header">
                    <span class="doc-date">${extractDocDate(doc)}</span>
                    <span class="doc-total">Pcs ${dayTotal.toLocaleString('en-US')} :إجمالي</span>
                </div>
                ${rowsHtml}
            `;
            container.appendChild(card);
        });

        document.getElementById('totalItemsCount').textContent = totalScanned.toLocaleString('en-US');

        const sortedEmps = Object.keys(empTotals).sort((a,b) => empTotals[b] - empTotals[a]).slice(0, 5);
        renderChart(sortedEmps, sortedEmps.map(e => empTotals[e]));
    }

    function filterEntries() {
        const query = (document.getElementById('searchInput').value || '').toLowerCase().trim();
        const today = new Date();
        const todayISO = formatDateISO(today);

        const filtered = cacheDocs.filter(doc => {
            const docDate = extractDocDate(doc);
            let dateMatch = true;

            if (currentFilterMode === 'today') dateMatch = (docDate === todayISO);
            else if (currentFilterMode === 'yesterday') {
                const yest = new Date(); yest.setDate(today.getDate() - 1);
                dateMatch = (docDate === formatDateISO(yest));
            } else if (currentFilterMode === 'week') {
                const sevenDays = new Date(); sevenDays.setDate(today.getDate() - 7);
                dateMatch = (docDate >= formatDateISO(sevenDays) && docDate <= todayISO);
            } else if (currentFilterMode === 'month') {
                dateMatch = docDate.startsWith(`${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}`);
            }

            let searchMatch = !query || (doc.employee_scans || []).some(r => (r.employee_name || '').toLowerCase().includes(query));
            return dateMatch && searchMatch;
        });

        renderDocs(filtered, query);
    }

    function renderChart(labels, values) {
        const ctx = document.getElementById('employeeScanChart').getContext('2d');
        if (empChartInstance) empChartInstance.destroy();
        empChartInstance = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: labels,
                datasets: [{ data: values, backgroundColor: '#2563eb', borderRadius: 6 }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: { 
                    y: { beginAtZero: true, grid: { color: 'rgba(100, 116, 139, 0.1)' }, ticks: { font: { family: 'Cairo', size: 9 } } }, 
                    x: { grid: { display: false }, ticks: { font: { family: 'Cairo', size: 9, weight: 'bold' } } } 
                }
            }
        });
    }

    /* --- طلبات المواد (Material Request) --- */
    let cacheMRDocs = [];
    let mrDateFilterMode = 'month';

    function openMRModal() {
        document.getElementById('mrModal').classList.add('active');
        if (cacheMRDocs.length === 0) fetchAllMR();
        else filterMRData();
    }

    function closeMRModal() {
        document.getElementById('mrModal').classList.remove('active');
    }

    async function fetchAllMR() {
        const listContainer = document.getElementById('branchSummaryList');
        listContainer.innerHTML = `<div style="text-align:center; padding:20px; font-size:11px; font-weight:700; color:var(--text-muted);">${translations[currentLang]?.loading_branches || 'جاري تجميع بيانات الفروع...'}</div>`;

        try {
            let allRawList = [];
            let start = 0, pageLimit = 1000, fetchedCount = pageLimit;

            while (fetchedCount === pageLimit) {
                const filters = JSON.stringify([["docstatus", "=", 1]]);
                const fields = JSON.stringify(["name", "transaction_date", "schedule_date", "set_warehouse", "docstatus"]);
                const url = `${CONFIG.serverUrl}/api/resource/Material Request?filters=${encodeURIComponent(filters)}&fields=${encodeURIComponent(fields)}&limit_start=${start}&limit_page_length=${pageLimit}&order_by=transaction_date desc`;

                const res = await fetch(url, { headers: { "Authorization": `token ${CONFIG.apiKey}:${CONFIG.apiSecret}` } });
                const data = await res.json();
                const list = data.data || [];
                allRawList = allRawList.concat(list);
                fetchedCount = list.length;
                start += pageLimit;
            }

            cacheMRDocs = [];
            const batchSize = 30;

            for (let i = 0; i < allRawList.length; i += batchSize) {
                const batch = allRawList.slice(i, i + batchSize);
                await Promise.all(batch.map(async (item) => {
                    try {
                        const resDoc = await fetch(`${CONFIG.serverUrl}/api/resource/Material Request/${encodeURIComponent(item.name)}`, {
                            headers: { "Authorization": `token ${CONFIG.apiKey}:${CONFIG.apiSecret}` }
                        });
                        if (resDoc.ok) {
                            const doc = (await resDoc.json()).data;
                            if (doc && doc.items) {
                                const mainItems = doc.items.filter(it => (it.from_warehouse || doc.set_from_warehouse || '').toLowerCase().includes('main'));
                                if (mainItems.length > 0 || (doc.set_from_warehouse && doc.set_from_warehouse.toLowerCase().includes('main'))) {
                                    cacheMRDocs.push(doc);
                                }
                            }
                        }
                    } catch (e) {}
                }));
            }

            filterMRData();
        } catch (err) {
            listContainer.innerHTML = `<div style="text-align:center; color:red; font-size:11px; font-weight:700;">فشل جلب البيانات من السيرفر</div>`;
        }
    }

    function setMRDatePreset(mode, btnEl) {
        mrDateFilterMode = mode;
        btnEl.closest('.modal-body').querySelectorAll('.period-chips .chip').forEach(b => b.classList.remove('active'));
        btnEl.classList.add('active');
        filterMRData();
    }

    function filterMRData() {
        const today = new Date();
        const todayISO = formatDateISO(today);

        let totalSum = 0, transSum = 0, pendSum = 0;
        let branchTotals = {};

        cacheMRDocs.sort((a, b) => new Date(extractDocDate(b)) - new Date(extractDocDate(a)));

        cacheMRDocs.forEach(doc => {
            const tDate = doc.transaction_date || extractDocDate(doc);
            let dateMatch = true;

            if (mrDateFilterMode === 'today') dateMatch = (tDate === todayISO);
            else if (mrDateFilterMode === 'yesterday') {
                const yest = new Date(); yest.setDate(today.getDate() - 1);
                dateMatch = (tDate === formatDateISO(yest));
            } else if (mrDateFilterMode === 'week') {
                const sevenDays = new Date(); sevenDays.setDate(today.getDate() - 7);
                dateMatch = (tDate >= formatDateISO(sevenDays) && tDate <= todayISO);
            } else if (mrDateFilterMode === 'month') {
                dateMatch = tDate.startsWith(`${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}`);
            }

            if (!dateMatch) return;

            const docTarget = doc.set_warehouse || (doc.items && doc.items[0] && doc.items[0].warehouse) || 'فرع غير محدد';

            if (!branchTotals[docTarget]) {
                branchTotals[docTarget] = { qty: 0, trans: 0, pend: 0 };
            }

            (doc.items || []).forEach(item => {
                const q = Number(item.qty || 0);
                const t = Number(item.ordered_qty || item.transferred_qty || 0);
                const p = Math.max(0, q - t);

                branchTotals[docTarget].qty += q;
                branchTotals[docTarget].trans += t;
                branchTotals[docTarget].pend += p;

                totalSum += q;
                transSum += t;
                pendSum += p;
            });
        });

        document.getElementById('mrTotalQty').textContent = totalSum.toLocaleString('en-US');
        document.getElementById('mrTransferredQty').textContent = transSum.toLocaleString('en-US');
        document.getElementById('mrPendingQty').textContent = pendSum.toLocaleString('en-US');

        const listContainer = document.getElementById('branchSummaryList');
        listContainer.innerHTML = '';

        const branchNames = Object.keys(branchTotals);

        if (branchNames.length === 0) {
            listContainer.innerHTML = `<div style="text-align:center; padding:20px; color:var(--text-muted); font-size:11px; font-weight:700;">${translations[currentLang]?.no_mr || 'لا توجد طلبات مواد بالفترات المحددة.'}</div>`;
            return;
        }

        branchNames.sort((a,b) => branchTotals[b].qty - branchTotals[a].qty).forEach(branchName => {
            const data = branchTotals[branchName];
            const card = document.createElement('div');
            card.className = 'branch-summary-card';
            card.innerHTML = `
                <div class="branch-card-title">
                    <i class="fa-solid fa-store"></i>
                    <span>${branchName}</span>
                </div>
                <div class="branch-values-grid">
                    <div class="branch-val-box">
                        <span data-i18n="card_required">${translations[currentLang]?.card_required || 'المطلوب'}</span>
                        <strong style="color:var(--danger);">${data.qty.toLocaleString('en-US')}</strong>
                    </div>
                    <div class="branch-val-box">
                        <span data-i18n="card_transferred">${translations[currentLang]?.card_transferred || 'المحول'}</span>
                        <strong style="color:var(--success);">${data.trans.toLocaleString('en-US')}</strong>
                    </div>
                    <div class="branch-val-box">
                        <span data-i18n="card_pending">${translations[currentLang]?.card_pending || 'المتبقي'}</span>
                        <strong style="color:var(--warning);">${data.pend.toLocaleString('en-US')}</strong>
                    </div>
                </div>
            `;
            listContainer.appendChild(card);
        });
    }
</script>
</body>
</html>
