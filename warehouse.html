<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlRoot">
<head>
    <link rel="manifest" href="./manifest.json">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title data-i18n="page_title">إدارة المستودع - الموسى التجارية</title>
    
    <link rel="stylesheet" href="style.css?v=2026.5">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        .main-container {
            width: 100%;
            max-width: 1350px;
            margin: 0 auto;
            padding: 0 15px;
        }

        /* 📱 ترويسة ثابتة وموحدة تضمن بقاء الأزرار في سطر واحد على الجوال */
        header {
            display: flex !important;
            flex-direction: row !important;
            justify-content: space-between !important;
            align-items: center !important;
            flex-wrap: nowrap !important;
            gap: 6px !important;
            margin-bottom: 20px !important;
            padding: 12px 14px !important;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0284c7 100%) !important;
            color: #ffffff !important;
            border-radius: 14px !important;
            box-shadow: 0 8px 20px -4px rgba(2, 132, 199, 0.2);
            border: 2px solid #38bdf8 !important;
            position: relative;
            overflow: hidden;
        }

        header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, #38bdf8, #3b82f6, #10b981);
        }

        .header-title-box {
            flex: 1 1 auto !important;
            min-width: 0 !important;
        }

        .header-title-box h1 {
            font-size: 14px !important;
            color: #ffffff !important;
            font-weight: 800;
            white-space: nowrap !important;
            overflow: hidden !important;
            text-overflow: ellipsis !important;
            margin: 0 !important;
            line-height: 1.3;
        }

        .header-title-box p {
            font-size: 9.5px !important;
            color: #bae6fd !important;
            margin: 0 !important;
            font-weight: 600;
            white-space: nowrap !important;
            overflow: hidden !important;
            text-overflow: ellipsis !important;
        }

        .header-left-group {
            display: flex !important;
            flex-direction: row !important;
            align-items: center !important;
            flex-wrap: nowrap !important;
            gap: 4px !important;
            flex-shrink: 0 !important;
            width: auto !important;
        }

        .action-btn {
            background: rgba(255, 255, 255, 0.15) !important;
            border: 1.5px solid rgba(255, 255, 255, 0.3) !important;
            width: 32px !important;
            height: 32px !important;
            min-width: 32px !important;
            max-width: 32px !important;
            border-radius: 8px !important;
            cursor: pointer;
            font-size: 13px !important;
            color: #ffffff !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            text-decoration: none;
            padding: 0 !important;
            margin: 0 !important;
            flex-shrink: 0 !important;
            transition: all 0.25s;
        }
        .action-btn:hover {
            background: rgba(255, 255, 255, 0.25) !important;
            border-color: #ffffff !important;
            transform: translateY(-2px);
        }

        .lang-select {
            background: rgba(255, 255, 255, 0.15) !important;
            border: 1.5px solid rgba(255, 255, 255, 0.3) !important;
            padding: 0 4px !important;
            border-radius: 8px !important;
            font-size: 10px !important;
            font-weight: 700;
            color: #ffffff !important;
            height: 32px !important;
            outline: none;
            cursor: pointer;
            margin: 0 !important;
            flex-shrink: 0 !important;
            width: auto !important;
        }
        .lang-select option {
            background: #1e293b;
            color: #ffffff;
        }

        .hero-metric-card {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 50%, #0284c7 100%);
            color: white;
            border-radius: 20px;
            padding: 24px;
            margin-bottom: 25px;
            box-shadow: 0 15px 35px -8px rgba(2, 132, 199, 0.45);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 2px solid #38bdf8;
        }

        .hero-metric-info span {
            font-size: 12px;
            color: #bae6fd;
            font-weight: 700;
            display: block;
        }

        .hero-metric-info h2 {
            font-size: 26px;
            font-weight: 900;
            margin-top: 6px;
            color: #ffffff;
            letter-spacing: -0.5px;
        }

        .hero-metric-icon {
            width: 55px;
            height: 55px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .btn-mr-banner {
            width: 100%;
            height: 50px;
            background: linear-gradient(135deg, #059669 0%, #047857 100%);
            color: white;
            border: none;
            border-radius: 18px;
            font-size: 13px;
            font-weight: 850;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(5, 150, 105, 0.3);
            margin-bottom: 25px;
            transition: transform 0.2s;
        }
        .btn-mr-banner:hover { transform: translateY(-2px); }

        .filter-panel {
            background: var(--bg-card);
            padding: 24px;
            border-radius: 18px;
            box-shadow: var(--shadow);
            margin-bottom: 25px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            border: 2px solid var(--border);
        }

        .period-chips {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
        }

        .chip {
            background: var(--accent-light);
            border: 2px solid var(--accent-border, var(--border));
            padding: 10px 6px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 700;
            text-align: center;
            cursor: pointer;
            color: var(--accent);
            transition: all 0.2s;
        }
        .chip.active {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
        }

        .search-field {
            position: relative;
        }

        .search-field input {
            width: 100%;
            padding: 12px 42px 12px 16px;
            background: var(--bg-body);
            border: 2px solid var(--border);
            border-radius: 14px;
            font-size: 13px;
            outline: none;
            color: var(--text-main);
            font-weight: 700;
            height: 46px;
            transition: border-color 0.2s;
        }
        .search-field input:focus { border-color: var(--accent); }

        .search-field i {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 14px;
        }

        .chart-box {
            background: var(--bg-card);
            border-radius: 18px;
            padding: 24px;
            box-shadow: var(--shadow);
            border: 2px solid var(--border);
            margin-bottom: 25px;
        }

        .chart-title {
            font-size: 14px;
            font-weight: 850;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-main);
        }

        .chart-container {
            position: relative;
            width: 100%;
            height: 250px;
        }

        .doc-card {
            background: var(--bg-card);
            border-radius: 18px;
            padding: 18px 20px;
            box-shadow: var(--shadow);
            border: 2px solid var(--border);
            margin-bottom: 15px;
            border-right: 5px solid var(--accent);
        }

        .doc-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 10px;
            margin-bottom: 10px;
            border-bottom: 2px solid var(--border);
        }

        .doc-date {
            font-size: 13px;
            font-weight: 850;
            color: var(--text-main);
        }

        .doc-total {
            background: var(--accent-light);
            color: var(--accent);
            font-size: 11.5px;
            font-weight: 850;
            padding: 4px 10px;
            border-radius: 10px;
            border: 1px solid var(--accent-border, var(--border));
        }

        .emp-row {
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding: 8px 0;
            border-top: 1px dashed var(--border);
        }

        .emp-info {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            font-weight: 750;
            color: var(--text-main);
        }

        .kpi-bar {
            height: 6px;
            background: var(--border);
            border-radius: 4px;
            overflow: hidden;
            display: flex;
        }

        .kpi-fill {
            height: 100%;
            border-radius: 4px;
        }

        /* Modal طلبات المواد */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(4px);
            z-index: 2000;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-box {
            background: var(--bg-card);
            width: 100%;
            max-width: 650px;
            max-height: 85vh;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.3);
            border: 2px solid var(--border);
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .modal-header {
            padding: 18px 24px;
            background: var(--bg-body);
            border-bottom: 2px solid var(--border);
            color: var(--text-main);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h2 {
            font-size: 15px;
            font-weight: 900;
        }

        .modal-close {
            background: var(--bg-card);
            border: 2px solid var(--border);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            color: var(--text-muted);
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        .modal-close:hover { color: var(--text-main); border-color: var(--accent); }

        .modal-body {
            padding: 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .stats-card {
            background: var(--bg-body);
            border-radius: 14px;
            padding: 14px;
            border: 2px solid var(--border);
            text-align: center;
        }

        .stats-card span {
            font-size: 11px;
            font-weight: 750;
            color: var(--text-muted);
            display: block;
        }

        .stats-card h2 {
            font-size: 18px;
            font-weight: 900;
            margin-top: 4px;
        }

        .branch-summary-card {
            background: var(--bg-body);
            border: 2px solid var(--border);
            border-radius: 14px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .branch-card-title {
            font-size: 13px;
            font-weight: 850;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 1px dashed var(--border);
            padding-bottom: 8px;
        }

        .branch-values-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            text-align: center;
        }

        .branch-val-box {
            background: var(--bg-card);
            padding: 8px 6px;
            border-radius: 10px;
            border: 1.5px solid var(--border);
        }

        .branch-val-box span {
            font-size: 10px;
            font-weight: 750;
            color: var(--text-muted);
            display: block;
        }

        .branch-val-box strong {
            font-size: 13px;
            font-weight: 900;
        }

        /* 💻 التجاوب المتقدم لشاشات الكمبيوتر واللابتوب */
        @media (min-width: 768px) {
            header {
                padding: 20px 28px !important;
            }
            .header-title-box h1 {
                font-size: 18px !important;
            }
            .header-title-box p {
                font-size: 11.5px !important;
            }
            .action-btn {
                width: 44px !important;
                height: 44px !important;
                min-width: 44px !important;
                font-size: 16px !important;
                border-radius: 14px !important;
            }
            .lang-select {
                height: 44px !important;
                font-size: 12px !important;
                padding: 0 14px !important;
                border-radius: 14px !important;
            }
            .header-left-group {
                gap: 10px !important;
            }
            .main-container {
                max-width: 1350px !important;
                padding: 0 20px;
            }
            .filter-panel .period-chips {
                grid-template-columns: repeat(5, 1fr) !important;
            }
        }
    </style>
</head>
<body data-theme="light">

<div class="main-container">
    <header>
        <div class="header-title-box">
            <h1 data-i18n="app_title">إدارة المستودع</h1>
            <p data-i18n="app_subtitle">سجلات المسح</p>
        </div>
        <div class="header-left-group">
            <button class="action-btn" id="themeToggleBtn" onclick="toggleTheme()" title="تغيير المظهر">
                <i class="fa-solid fa-moon" id="themeIcon"></i>
            </button>
            <select id="langSelect" class="lang-select" onchange="changeLanguage(this.value)">
                <option value="ar">العربية</option>
                <option value="en">English</option>
                <option value="hi">हिन्दी</option>
                <option value="ur">اردو</option>
            </select>
            <button class="action-btn" onclick="fetchScanEntries()" title="تحديث">
                <i class="fa-solid fa-rotate"></i>
            </button>
            <a href="index.html" class="action-btn" title="الرئيسية">
                <i class="fa-solid fa-house"></i>
            </a>
        </div>
    </header>

    <div class="hero-metric-card">
        <div class="hero-metric-info">
            <span data-i18n="total_scanned">إجمالي القطع الممسوحة</span>
            <h2 id="totalItemsCount">0</h2>
        </div>
        <div class="hero-metric-icon">
            <i class="fa-solid fa-boxes-stacked"></i>
        </div>
    </div>

    <button class="btn-mr-banner" onclick="openMRModal()">
        <i class="fa-solid fa-truck-ramp-box"></i>
        <span data-i18n="mr_button">عرض طلبات المواد (MR) حسب الفروع</span>
    </button>

    <div class="filter-panel">
        <div class="period-chips">
            <button class="chip" onclick="setDatePreset('today')" data-i18n="preset_today">اليوم</button>
            <button class="chip" onclick="setDatePreset('yesterday')" data-i18n="preset_yesterday">أمس</button>
            <button class="chip" onclick="setDatePreset('week')" data-i18n="preset_week">الأسبوع</button>
            <button class="chip active" id="monthPresetBtn" onclick="setDatePreset('month')" data-i18n="preset_month">الشهر</button>
            <button class="chip" onclick="setDatePreset('all')" data-i18n="preset_all">الكل</button>
        </div>

        <div class="search-field">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="searchInput" onkeyup="filterEntries()" data-i18n-placeholder="search_placeholder" placeholder="ابحث باسم الموظف...">
        </div>
    </div>

    <div class="chart-box">
        <div class="chart-title">
            <i class="fa-solid fa-chart-column" style="color:var(--accent);"></i> 
            <span data-i18n="chart_title">أداء الموظفين هذا الشهر</span>
        </div>
        <div class="chart-container">
            <canvas id="employeeScanChart"></canvas>
        </div>
    </div>

    <div id="entriesContainer">
        <div style="text-align:center; padding: 35px; color: var(--text-muted); font-size: 12px; font-weight: 750;" data-i18n="loading">جاري تحميل البيانات...</div>
    </div>
</div>

<!-- Modal طلبات المواد -->
<div class="modal-overlay" id="mrModal">
    <div class="modal-box">
        <div class="modal-header">
            <h2 data-i18n="mr_modal_title">إجمالي طلبات المواد حسب الفروع</h2>
            <button class="modal-close" onclick="closeMRModal()"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="modal-body">
            <div class="metrics-grid">
                <div class="stats-card">
                    <span data-i18n="card_required">المطلوب</span>
                    <h2 id="mrTotalQty" style="color:var(--danger, #ef4444);">0</h2>
                </div>
                <div class="stats-card">
                    <span data-i18n="card_transferred">المحول</span>
                    <h2 id="mrTransferredQty" style="color:var(--success, #10b981);">0</h2>
                </div>
                <div class="stats-card">
                    <span data-i18n="card_pending">المتبقي</span>
                    <h2 id="mrPendingQty" style="color:var(--warning, #f59e0b);">0</h2>
                </div>
            </div>

            <div class="period-chips">
                <button class="chip" onclick="setMRDatePreset('today', this)" data-i18n="preset_today">اليوم</button>
                <button class="chip" onclick="setMRDatePreset('yesterday', this)" data-i18n="preset_yesterday">أمس</button>
                <button class="chip" onclick="setMRDatePreset('week', this)" data-i18n="preset_week">الأسبوع</button>
                <button class="chip active" onclick="setMRDatePreset('month', this)" data-i18n="preset_month">الشهر</button>
                <button class="chip" onclick="setMRDatePreset('all', this)" data-i18n="preset_all">الكل</button>
            </div>

            <div class="branch-summary-list" id="branchSummaryList" style="display:flex; flex-direction:column; gap:10px;">
                <div style="text-align:center; padding:20px; font-size:12px; color:var(--text-muted); font-weight:750;" data-i18n="loading_branches">جاري تجميع بيانات الفروع...</div>
            </div>
        </div>
    </div>
</div>

            preset_month: "مہینہ",
            preset_all: "سب",
            search_placeholder: "ملازم تلاش کریں...",
            chart_title: "ملازم کی کارکردگی",
            loading: "لوڈ ہو رہا ہے...",
            mr_modal_title: "برانچ وار MR",
            card_required: "مطلوبہ",
            card_transferred: "منتقل شدہ",
            card_pending: "بقیہ",
            loading_branches: "برانچ کا ڈیٹا لوڈ ہو رہا ہے...",
            no_records: "کوئی ریکارڈ نہیں",
            no_mr: "کوئی مواد کی درخواست نہیں ملی۔"
        }
    };

    let currentLang = localStorage.getItem('app_lang') || 'ar';

    function setLanguage(lang) {
        currentLang = lang;
        localStorage.setItem('app_lang', lang);
        const root = document.getElementById('htmlRoot');
        root.setAttribute('lang', lang);
        root.setAttribute('dir', (lang === 'ar' || lang === 'ur') ? 'rtl' : 'ltr');
        
        const selectEl = document.getElementById('langSelect');
        if (selectEl) selectEl.value = lang;

        document.querySelectorAll('[data-i18n]').forEach(el => {
            const key = el.getAttribute('data-i18n');
            if (translations[lang] && translations[lang][key]) {
                el.textContent = translations[lang][key];
            }
        });

        document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
            const key = el.getAttribute('data-i18n-placeholder');
            if (translations[lang] && translations[lang][key]) {
                el.placeholder = translations[lang][key];
            }
        });
    }

    function changeLanguage(lang) {
        setLanguage(lang);
        filterEntries();
        if(cacheMRDocs.length > 0) filterMRData();
    }

    function toggleTheme() {
        const currentTheme = document.documentElement.getAttribute('data-theme') || localStorage.getItem('app_theme') || 'light';
        const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
        
        document.documentElement.setAttribute('data-theme', newTheme);
        document.body.setAttribute('data-theme', newTheme);
        localStorage.setItem('app_theme', newTheme);
        
        const themeIcon = document.getElementById('themeIcon');
        if (themeIcon) {
            themeIcon.className = newTheme === 'dark' ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        setLanguage(currentLang);
        const savedTheme = localStorage.getItem('app_theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);
        document.body.setAttribute('data-theme', savedTheme);
        const themeIcon = document.getElementById('themeIcon');
        if (themeIcon) {
            themeIcon.className = savedTheme === 'dark' ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
        }
        fetchScanEntries();
    });

    const CONFIG = {
        serverUrl: "https://87-237-225-155.nip.io",
        apiKey: "6f039a5a6130b79",
        apiSecret: "9e6d920a8fda252"
    };

    let cacheDocs = [];
    let currentFilterMode = 'month';
    let empChartInstance = null;

    function formatDateISO(dateObj) {
        const year = dateObj.getFullYear();
        const month = String(dateObj.getMonth() + 1).padStart(2, '0');
        const day = String(dateObj.getDate()).padStart(2, '0');
        return `${year}-${month}-${day}`;
    }

    function extractDocDate(doc) {
        if (!doc) return '';
        let d = doc.scan_date || doc.date || doc.posting_date || doc.creation || '';
        return d.includes(' ') ? d.split(' ')[0] : d;
    }

    function setDatePreset(mode) {
        currentFilterMode = mode;
        document.querySelectorAll('.filter-panel .chip').forEach(btn => btn.classList.remove('active'));
        if (event && event.target) event.target.classList.add('active');
        filterEntries();
    }

    async function fetchScanEntries() {
        const container = document.getElementById('entriesContainer');
        try {
            const filters = JSON.stringify([["docstatus", "=", 1]]);
            const url = `${CONFIG.serverUrl}/api/resource/Employee Scan Entry?filters=${encodeURIComponent(filters)}&limit_page_length=2000&order_by=scan_date asc`;
            const res = await fetch(url, { headers: { "Authorization": `token ${CONFIG.apiKey}:${CONFIG.apiSecret}` } });
            const listData = await res.json();
            const docsList = listData.data || [];

            cacheDocs = await Promise.all(docsList.map(async (doc) => {
                const resDoc = await fetch(`${CONFIG.serverUrl}/api/resource/Employee Scan Entry/${encodeURIComponent(doc.name)}`, {
                    headers: { "Authorization": `token ${CONFIG.apiKey}:${CONFIG.apiSecret}` }
                });
                return resDoc.ok ? (await resDoc.json()).data : null;
            }));

            cacheDocs = cacheDocs.filter(d => d !== null);
            filterEntries();
        } catch (err) {
            container.innerHTML = `<div style="text-align:center; color:red; font-size:12px;">خطأ بالاتصال بالسيرفر</div>`;
        }
    }

    function renderDocs(docs, searchQuery = '') {
        const container = document.getElementById('entriesContainer');
        container.innerHTML = '';
        let totalScanned = 0;
        let empTotals = {};

        if (docs.length === 0) {
            container.innerHTML = `<div style="text-align:center; padding:35px; color:var(--text-muted); font-size:12px; font-weight:750;">${translations[currentLang]?.no_records || 'لا توجد سجلات'}</div>`;
            document.getElementById('totalItemsCount').textContent = '0';
            renderChart([], []);
            return;
        }

        docs.sort((a, b) => new Date(extractDocDate(b)) - new Date(extractDocDate(a)));

        docs.forEach(doc => {
            const scans = doc.employee_scans || [];
            let dayTotal = 0;
            scans.forEach(r => dayTotal += Number(r.scanned_items || 0));
            totalScanned += dayTotal;

            let rowsHtml = '';
            scans.forEach(row => {
                const empName = row.employee_name || 'غير معروف';
                if (searchQuery && !empName.toLowerCase().includes(searchQuery)) return;

                const count = Number(row.scanned_items || 0);
                empTotals[empName] = (empTotals[empName] || 0) + count;
                const percent = dayTotal > 0 ? Math.round((count / dayTotal) * 100) : 0;

                let fillColor = '#2563eb';
                if (percent >= 40) fillColor = '#10b981';
                else if (percent >= 20) fillColor = '#f59e0b';
                else fillColor = '#ef4444';

                rowsHtml += `
                    <div class="emp-row">
                        <div class="emp-info">
                            <span>${empName}</span>
                            <span>Pcs (${percent}%) ${count.toLocaleString('en-US')}</span>
                        </div>
                        <div class="kpi-bar">
                            <div class="kpi-fill" style="width:${percent}%; background:${fillColor};"></div>
                        </div>
                    </div>
                `;
            });

            if (rowsHtml === '' && searchQuery) return;

            const card = document.createElement('div');
            card.className = 'doc-card';
            card.innerHTML = `
                <div class="doc-card-header">
                    <span class="doc-date">${extractDocDate(doc)}</span>
                    <span class="doc-total">Pcs ${dayTotal.toLocaleString('en-US')} :إجمالي</span>
                </div>
                ${rowsHtml}
            `;
            container.appendChild(card);
        });

        document.getElementById('totalItemsCount').textContent = totalScanned.toLocaleString('en-US');

        const sortedEmps = Object.keys(empTotals).sort((a,b) => empTotals[b] - empTotals[a]).slice(0, 5);
        renderChart(sortedEmps, sortedEmps.map(e => empTotals[e]));
    }

    function filterEntries() {
        const query = (document.getElementById('searchInput').value || '').toLowerCase().trim();
        const today = new Date();
        const todayISO = formatDateISO(today);

        const filtered = cacheDocs.filter(doc => {
            const docDate = extractDocDate(doc);
            let dateMatch = true;

            if (currentFilterMode === 'today') dateMatch = (docDate === todayISO);
            else if (currentFilterMode === 'yesterday') {
                const yest = new Date(); yest.setDate(today.getDate() - 1);
                dateMatch = (docDate === formatDateISO(yest));
            } else if (currentFilterMode === 'week') {
                const sevenDays = new Date(); sevenDays.setDate(today.getDate() - 7);
                dateMatch = (docDate >= formatDateISO(sevenDays) && docDate <= todayISO);
            } else if (currentFilterMode === 'month') {
                dateMatch = docDate.startsWith(`${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}`);
            }

            let searchMatch = !query || (doc.employee_scans || []).some(r => (r.employee_name || '').toLowerCase().includes(query));
            return dateMatch && searchMatch;
        });

        renderDocs(filtered, query);
    }

    function renderChart(labels, values) {
        const ctx = document.getElementById('employeeScanChart').getContext('2d');
        if (empChartInstance) empChartInstance.destroy();
        empChartInstance = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: labels,
                datasets: [{ data: values, backgroundColor: '#2563eb', borderRadius: 8 }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: { 
                    y: { beginAtZero: true, grid: { color: 'rgba(100, 116, 139, 0.1)' }, ticks: { font: { family: 'Cairo', size: 10 } } }, 
                    x: { grid: { display: false }, ticks: { font: { family: 'Cairo', size: 10, weight: 'bold' } } } 
                }
            }
        });
    }

    let cacheMRDocs = [];
    let mrDateFilterMode = 'month';

    function openMRModal() {
        document.getElementById('mrModal').classList.add('active');
        if (cacheMRDocs.length === 0) fetchAllMR();
        else filterMRData();
    }

    function closeMRModal() {
        document.getElementById('mrModal').classList.remove('active');
    }

    async function fetchAllMR() {
        const listContainer = document.getElementById('branchSummaryList');
        listContainer.innerHTML = `<div style="text-align:center; padding:20px; font-size:12px; font-weight:750; color:var(--text-muted);">${translations[currentLang]?.loading_branches || 'جاري تجميع بيانات الفروع...'}</div>`;

        try {
            let allRawList = [];
            let start = 0, pageLimit = 1000, fetchedCount = pageLimit;

            while (fetchedCount === pageLimit) {
                const filters = JSON.stringify([["docstatus", "=", 1]]);
                const fields = JSON.stringify(["name", "transaction_date", "schedule_date", "set_warehouse", "docstatus"]);
                const url = `${CONFIG.serverUrl}/api/resource/Material Request?filters=${encodeURIComponent(filters)}&fields=${encodeURIComponent(fields)}&limit_start=${start}&limit_page_length=${pageLimit}&order_by=transaction_date desc`;

                const res = await fetch(url, { headers: { "Authorization": `token ${CONFIG.apiKey}:${CONFIG.apiSecret}` } });
                const data = await res.json();
                const list = data.data || [];
                allRawList = allRawList.concat(list);
                fetchedCount = list.length;
                start += pageLimit;
            }

            cacheMRDocs = [];
            const batchSize = 30;

            for (let i = 0; i < allRawList.length; i += batchSize) {
                const batch = allRawList.slice(i, i + batchSize);
                await Promise.all(batch.map(async (item) => {
                    try {
                        const resDoc = await fetch(`${CONFIG.serverUrl}/api/resource/Material Request/${encodeURIComponent(item.name)}`, {
                            headers: { "Authorization": `token ${CONFIG.apiKey}:${CONFIG.apiSecret}` }
                        });
                        if (resDoc.ok) {
                            const doc = (await resDoc.json()).data;
                            if (doc && doc.items) {
                                const mainItems = doc.items.filter(it => (it.from_warehouse || doc.set_from_warehouse || '').toLowerCase().includes('main'));
                                if (mainItems.length > 0 || (doc.set_from_warehouse && doc.set_from_warehouse.toLowerCase().includes('main'))) {
                                    cacheMRDocs.push(doc);
                                }
                            }
                        }
                    } catch (e) {}
                }));
            }

            filterMRData();
        } catch (err) {
            listContainer.innerHTML = `<div style="text-align:center; color:red; font-size:12px; font-weight:750;">فشل جلب البيانات من السيرفر</div>`;
        }
    }

    function setMRDatePreset(mode, btnEl) {
        mrDateFilterMode = mode;
        btnEl.closest('.modal-body').querySelectorAll('.period-chips .chip').forEach(b => b.classList.remove('active'));
        btnEl.classList.add('active');
        filterMRData();
    }

    function filterMRData() {
        const today = new Date();
        const todayISO = formatDateISO(today);

        let totalSum = 0, transSum = 0, pendSum = 0;
        let branchTotals = {};

        cacheMRDocs.sort((a, b) => new Date(extractDocDate(b)) - new Date(extractDocDate(a)));

        cacheMRDocs.forEach(doc => {
            const tDate = doc.transaction_date || extractDocDate(doc);
            let dateMatch = true;

            if (mrDateFilterMode === 'today') dateMatch = (tDate === todayISO);
            else if (mrDateFilterMode === 'yesterday') {
                const yest = new Date(); yest.setDate(today.getDate() - 1);
                dateMatch = (tDate === formatDateISO(yest));
            } else if (mrDateFilterMode === 'week') {
                const sevenDays = new Date(); sevenDays.setDate(today.getDate() - 7);
                dateMatch = (tDate >= formatDateISO(sevenDays) && tDate <= todayISO);
            } else if (mrDateFilterMode === 'month') {
                dateMatch = tDate.startsWith(`${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}`);
            }

            if (!dateMatch) return;

            const docTarget = doc.set_warehouse || (doc.items && doc.items[0] && doc.items[0].warehouse) || 'فرع غير محدد';

            if (!branchTotals[docTarget]) {
                branchTotals[docTarget] = { qty: 0, trans: 0, pend: 0 };
            }

            (doc.items || []).forEach(item => {
                const q = Number(item.qty || 0);
                const t = Number(item.ordered_qty || item.transferred_qty || 0);
                const p = Math.max(0, q - t);

                branchTotals[docTarget].qty += q;
                branchTotals[docTarget].trans += t;
                branchTotals[docTarget].pend += p;

                totalSum += q;
                transSum += t;
                pendSum += p;
            });
        });

        document.getElementById('mrTotalQty').textContent = totalSum.toLocaleString('en-US');
        document.getElementById('mrTransferredQty').textContent = transSum.toLocaleString('en-US');
        document.getElementById('mrPendingQty').textContent = pendSum.toLocaleString('en-US');

        const listContainer = document.getElementById('branchSummaryList');
        listContainer.innerHTML = '';

        const branchNames = Object.keys(branchTotals);

        if (branchNames.length === 0) {
            listContainer.innerHTML = `<div style="text-align:center; padding:20px; color:var(--text-muted); font-size:12px; font-weight:750;">${translations[currentLang]?.no_mr || 'لا توجد طلبات مواد بالفترات المحددة.'}</div>`;
            return;
        }

        branchNames.sort((a,b) => branchTotals[b].qty - branchTotals[a].qty).forEach(branchName => {
            const data = branchTotals[branchName];
            const card = document.createElement('div');
            card.className = 'branch-summary-card';
            card.innerHTML = `
                <div class="branch-card-title">
                    <i class="fa-solid fa-store"></i>
                    <span>${branchName}</span>
                </div>
                <div class="branch-values-grid">
                    <div class="branch-val-box">
                        <span data-i18n="card_required">${translations[currentLang]?.card_required || 'المطلوب'}</span>
                        <strong style="color:var(--danger, #ef4444);">${data.qty.toLocaleString('en-US')}</strong>
                    </div>
                    <div class="branch-val-box">
                        <span data-i18n="card_transferred">${translations[currentLang]?.card_transferred || 'المحول'}</span>
                        <strong style="color:var(--success, #10b981);">${data.trans.toLocaleString('en-US')}</strong>
                    </div>
                    <div class="branch-val-box">
                        <span data-i18n="card_pending">${translations[currentLang]?.card_pending || 'المتبقي'}</span>
                        <strong style="color:var(--warning, #f59e0b);">${data.pend.toLocaleString('en-US')}</strong>
                    </div>
                </div>
            `;
            listContainer.appendChild(card);
        });
    }
</script>
</body>
</html>
