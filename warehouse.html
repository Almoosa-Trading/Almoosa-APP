<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlRoot">
<head>
    <link rel="manifest" href="./manifest.json">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>إدارة المستودع</title>

    <!-- خط Cairo ورسومات FontAwesome وتطبيق Chart.js -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root {
            --bg-main: #f8fafc;
            --surface-card: #ffffff;
            --brand-primary: #1d4ed8;
            --brand-light: #2563eb;
            --brand-soft: #eff6ff;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-main: #e2e8f0;
            --radius-md: 12px;
            --radius-lg: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            padding: 8px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .dashboard-container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* الهيدر العلوي */
        .app-header {
            background: var(--surface-card);
            padding: 10px 12px;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-main);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .brand-icon {
            width: 34px;
            height: 34px;
            background: var(--brand-primary);
            color: white;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }

        .brand-info h1 { font-size: 13px; font-weight: 800; }
        .brand-info p { font-size: 9px; color: var(--text-muted); }

        .header-actions { display: flex; gap: 6px; }

        .btn-icon {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            border: 1px solid var(--border-main);
            background: #f8fafc;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            font-size: 12px;
        }

        .btn-action-primary {
            height: 32px;
            padding: 0 10px;
            border-radius: 8px;
            background: var(--brand-primary);
            color: white;
            border: none;
            font-size: 10px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
        }

        /* كروت الإحصائيات المصغرة */
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
        }

        .stats-card {
            background: var(--surface-card);
            border-radius: 10px;
            padding: 8px;
            border: 1px solid var(--border-main);
            text-align: center;
        }

        .stats-card span { font-size: 9px; font-weight: 700; color: var(--text-muted); display: block; }
        .stats-card h2 { font-size: 15px; font-weight: 900; color: var(--brand-primary); margin-top: 2px; }

        /* منطقة الرسوم البيانية المصغرة */
        .chart-box {
            background: var(--surface-card);
            border-radius: var(--radius-md);
            padding: 10px;
            border: 1px solid var(--border-main);
        }

        .chart-title {
            font-size: 11px;
            font-weight: 800;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .chart-container {
            position: relative;
            width: 100%;
            height: 140px;
        }

        /* الفلاتر */
        .filter-card {
            background: var(--surface-card);
            border-radius: var(--radius-md);
            padding: 10px;
            border: 1px solid var(--border-main);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .preset-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 4px;
        }

        .preset-btn {
            background: #f8fafc;
            border: 1px solid var(--border-main);
            color: var(--text-muted);
            padding: 6px 2px;
            border-radius: 6px;
            font-size: 10px;
            font-weight: 700;
            text-align: center;
            cursor: pointer;
        }

        .preset-btn.active {
            background: var(--brand-primary);
            color: white;
            border-color: var(--brand-primary);
        }

        .search-field input {
            width: 100%;
            padding: 8px 30px 8px 10px;
            background: #f8fafc;
            border: 1px solid var(--border-main);
            border-radius: 8px;
            font-size: 11px;
            outline: none;
        }

        .search-field { position: relative; }
        .search-field i { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); color: #94a3b8; font-size: 11px; }

        /* كروت السجلات */
        .doc-card {
            background: var(--surface-card);
            border-radius: var(--radius-md);
            padding: 10px;
            border: 1px solid var(--border-main);
            margin-bottom: 8px;
        }

        .doc-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 5px;
            margin-bottom: 5px;
            border-bottom: 1px solid #f1f5f9;
        }

        .doc-date { font-size: 11px; font-weight: 800; }
        .doc-total { background: var(--brand-soft); color: var(--brand-primary); font-size: 10px; font-weight: 800; padding: 2px 6px; border-radius: 4px; }

        .emp-row {
            display: flex;
            flex-direction: column;
            gap: 3px;
            padding: 5px 0;
            border-top: 1px dashed #f1f5f9;
        }

        .emp-info { display: flex; justify-content: space-between; font-size: 10px; font-weight: 700; }

        .kpi-bar {
            height: 3px;
            background: #f1f5f9;
            border-radius: 3px;
            overflow: hidden;
            display: flex;
        }

        .kpi-fill { height: 100%; border-radius: 3px; }

        /* Modal طلبات المواد المحسن خصيصاً للجوال */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(15, 23, 42, 0.7);
            z-index: 999;
            display: none;
            justify-content: center;
            align-items: flex-end;
        }

        .modal-overlay.active { display: flex; }

        .modal-box {
            background: var(--surface-card);
            width: 100%;
            max-height: 85vh;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 -10px 25px rgba(0,0,0,0.2);
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        .modal-header {
            padding: 12px 16px;
            background: #0f172a;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h2 { font-size: 12px; font-weight: 800; }
        .modal-close { background: none; border: none; color: white; font-size: 16px; cursor: pointer; }

        .modal-body {
            padding: 10px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: calc(85vh - 50px);
        }

        /* كروت ملخص الفروع فقط */
        .branch-summary-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .branch-summary-card {
            background: #ffffff;
            border: 1px solid var(--border-main);
            border-radius: 10px;
            padding: 10px 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.02);
        }

        .branch-card-title {
            font-size: 11px;
            font-weight: 800;
            color: var(--brand-primary);
            display: flex;
            align-items: center;
            gap: 6px;
            border-bottom: 1px dashed var(--border-main);
            padding-bottom: 4px;
        }

        .branch-values-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 4px;
            text-align: center;
        }

        .branch-val-box {
            background: #f8fafc;
            padding: 6px 4px;
            border-radius: 6px;
            border: 1px solid #f1f5f9;
        }

        .branch-val-box span { font-size: 9px; font-weight: 700; color: var(--text-muted); display: block; }
        .branch-val-box strong { font-size: 12px; font-weight: 900; }
    </style>
</head>
<body>

<div class="dashboard-container">
    <header class="app-header">
        <div class="header-brand">
            <div class="brand-icon"><i class="fa-solid fa-boxes-stacked"></i></div>
            <div class="brand-info">
                <h1>إدارة المستودع</h1>
                <p>سجلات المسح وطلبات المواد</p>
            </div>
        </div>
        <div class="header-actions">
            <button class="btn-action-primary" onclick="openMRModal()">
                <i class="fa-solid fa-truck-ramp-box"></i>
                <span>طلبات (MR)</span>
            </button>
            <button class="btn-icon" onclick="fetchScanEntries()"><i class="fa-solid fa-rotate"></i></button>
            <a href="index.html" class="btn-icon"><i class="fa-solid fa-house"></i></a>
        </div>
    </header>

    <!-- إحصائيات سريعة -->
    <div class="metrics-grid">
        <div class="stats-card">
            <span>الممسوح</span>
            <h2 id="totalItemsCount">0</h2>
        </div>
        <div class="stats-card">
            <span>السجلات</span>
            <h2 id="totalDocCount">0</h2>
        </div>
        <div class="stats-card">
            <span>الإنجاز</span>
            <h2 style="color: var(--success);">100%</h2>
        </div>
    </div>

    <!-- رسم بياني مصغر -->
    <div class="chart-box">
        <div class="chart-title"><i class="fa-solid fa-chart-column" style="color:var(--brand-primary);"></i> أداء الموظفين هذا الشهر</div>
        <div class="chart-container">
            <canvas id="employeeScanChart"></canvas>
        </div>
    </div>

    <!-- الفلتر -->
    <div class="filter-card">
        <div class="preset-grid">
            <button class="preset-btn" onclick="setDatePreset('today')">اليوم</button>
            <button class="preset-btn" onclick="setDatePreset('yesterday')">أمس</button>
            <button class="preset-btn" onclick="setDatePreset('week')">الأسبوع</button>
            <button class="preset-btn active" id="monthPresetBtn" onclick="setDatePreset('month')">الشهر</button>
            <button class="preset-btn" onclick="setDatePreset('all')">الكل</button>
        </div>

        <div class="search-field">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="searchInput" onkeyup="filterEntries()" placeholder="ابحث باسم الموظف...">
        </div>
    </div>

    <!-- السجلات -->
    <div id="entriesContainer">
        <div style="text-align:center; padding: 20px; color: var(--text-muted); font-size: 11px;">جاري تحميل البيانات...</div>
    </div>
</div>

<!-- Modal طلبات المواد (عرض الفروع والإجمالي فقط) -->
<div class="modal-overlay" id="mrModal">
    <div class="modal-box">
        <div class="modal-header">
            <h2>إجمالي طلبات المواد حسب الفروع</h2>
            <button class="modal-close" onclick="closeMRModal()"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="modal-body">
            <!-- الإجماليات الكلية العلوية -->
            <div class="metrics-grid">
                <div class="stats-card">
                    <span>إجمالي المطلوب</span>
                    <h2 id="mrTotalQty" style="font-size: 13px;">0</h2>
                </div>
                <div class="stats-card">
                    <span>إجمالي المحول</span>
                    <h2 id="mrTransferredQty" style="font-size: 13px; color: var(--success);">0</h2>
                </div>
                <div class="stats-card">
                    <span>إجمالي المتبقي</span>
                    <h2 id="mrPendingQty" style="font-size: 13px; color: var(--danger);">0</h2>
                </div>
            </div>

            <div class="preset-grid">
                <button class="preset-btn" onclick="setMRDatePreset('today', this)">اليوم</button>
                <button class="preset-btn" onclick="setMRDatePreset('yesterday', this)">أمس</button>
                <button class="preset-btn" onclick="setMRDatePreset('week', this)">الأسبوع</button>
                <button class="preset-btn active" onclick="setMRDatePreset('month', this)">الشهر</button>
                <button class="preset-btn" onclick="setMRDatePreset('all', this)">الكل</button>
            </div>

            <!-- ملخص الفروع المجمعة فقط بدون تفاصيل طلبات منفردة -->
            <div class="branch-summary-list" id="branchSummaryList">
                <div style="text-align:center; padding: 15px; font-size: 11px;">جاري تجميع بيانات الفروع...</div>
            </div>
        </div>
    </div>
</div>

<script>
    const CONFIG = {
        serverUrl: "https://87-237-225-155.nip.io",
        apiKey: "6f039a5a6130b79",
        apiSecret: "9e6d920a8fda252"
    };

    let cacheDocs = [];
    let currentFilterMode = 'month';
    let empChartInstance = null;

    document.addEventListener('DOMContentLoaded', () => {
        fetchScanEntries();
    });

    function formatDateISO(dateObj) {
        const year = dateObj.getFullYear();
        const month = String(dateObj.getMonth() + 1).padStart(2, '0');
        const day = String(dateObj.getDate()).padStart(2, '0');
        return `${year}-${month}-${day}`;
    }

    function extractDocDate(doc) {
        if (!doc) return '';
        let d = doc.scan_date || doc.date || doc.posting_date || doc.creation || '';
        return d.includes(' ') ? d.split(' ')[0] : d;
    }

    function setDatePreset(mode) {
        currentFilterMode = mode;
        document.querySelectorAll('.filter-card .preset-btn').forEach(btn => btn.classList.remove('active'));
        if (event && event.target) event.target.classList.add('active');
        filterEntries();
    }

    async function fetchScanEntries() {
        const container = document.getElementById('entriesContainer');
        try {
            const filters = JSON.stringify([["docstatus", "=", 1]]);
            const url = `${CONFIG.serverUrl}/api/resource/Employee Scan Entry?filters=${encodeURIComponent(filters)}&limit_page_length=2000&order_by=scan_date asc`;
            const res = await fetch(url, { headers: { "Authorization": `token ${CONFIG.apiKey}:${CONFIG.apiSecret}` } });
            const listData = await res.json();
            const docsList = listData.data || [];

            cacheDocs = await Promise.all(docsList.map(async (doc) => {
                const resDoc = await fetch(`${CONFIG.serverUrl}/api/resource/Employee Scan Entry/${encodeURIComponent(doc.name)}`, {
                    headers: { "Authorization": `token ${CONFIG.apiKey}:${CONFIG.apiSecret}` }
                });
                return resDoc.ok ? (await resDoc.json()).data : null;
            }));

            cacheDocs = cacheDocs.filter(d => d !== null);
            filterEntries();
        } catch (err) {
            container.innerHTML = `<div style="text-align:center; color:red; font-size:11px;">خطأ بالاتصال بالسيرفر</div>`;
        }
    }

    function renderDocs(docs, searchQuery = '') {
        const container = document.getElementById('entriesContainer');
        container.innerHTML = '';
        let totalScanned = 0;
        let empTotals = {};

        document.getElementById('totalDocCount').textContent = docs.length;

        if (docs.length === 0) {
            container.innerHTML = `<div style="text-align:center; padding:15px; font-size:11px; color:#64748b;">لا توجد سجلات</div>`;
            document.getElementById('totalItemsCount').textContent = '0';
            renderChart([], []);
            return;
        }

        docs.forEach(doc => {
            const scans = doc.employee_scans || [];
            let dayTotal = 0;
            scans.forEach(r => dayTotal += Number(r.scanned_items || 0));
            totalScanned += dayTotal;

            let rowsHtml = '';
            scans.forEach(row => {
                const empName = row.employee_name || 'غير معروف';
                if (searchQuery && !empName.toLowerCase().includes(searchQuery)) return;

                const count = Number(row.scanned_items || 0);
                empTotals[empName] = (empTotals[empName] || 0) + count;
                const percent = dayTotal > 0 ? Math.round((count / dayTotal) * 100) : 0;

                rowsHtml += `
                    <div class="emp-row">
                        <div class="emp-info">
                            <span>${empName}</span>
                            <span>${count.toLocaleString('en-US')} Pcs (${percent}%)</span>
                        </div>
                        <div class="kpi-bar">
                            <div class="kpi-fill" style="width:${percent}%; background:var(--brand-primary);"></div>
                        </div>
                    </div>
                `;
            });

            if (rowsHtml === '' && searchQuery) return;

            const card = document.createElement('div');
            card.className = 'doc-card';
            card.innerHTML = `
                <div class="doc-card-header">
                    <span class="doc-date">${extractDocDate(doc)}</span>
                    <span class="doc-total">إجمالي: ${dayTotal.toLocaleString('en-US')} Pcs</span>
                </div>
                ${rowsHtml}
            `;
            container.appendChild(card);
        });

        document.getElementById('totalItemsCount').textContent = totalScanned.toLocaleString('en-US');

        const sortedEmps = Object.keys(empTotals).sort((a,b) => empTotals[b] - empTotals[a]).slice(0, 5);
        renderChart(sortedEmps, sortedEmps.map(e => empTotals[e]));
    }

    function filterEntries() {
        const query = (document.getElementById('searchInput').value || '').toLowerCase().trim();
        const today = new Date();
        const todayISO = formatDateISO(today);

        const filtered = cacheDocs.filter(doc => {
            const docDate = extractDocDate(doc);
            let dateMatch = true;

            if (currentFilterMode === 'today') dateMatch = (docDate === todayISO);
            else if (currentFilterMode === 'yesterday') {
                const yest = new Date(); yest.setDate(today.getDate() - 1);
                dateMatch = (docDate === formatDateISO(yest));
            } else if (currentFilterMode === 'week') {
                const sevenDays = new Date(); sevenDays.setDate(today.getDate() - 7);
                dateMatch = (docDate >= formatDateISO(sevenDays) && docDate <= todayISO);
            } else if (currentFilterMode === 'month') {
                dateMatch = docDate.startsWith(`${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}`);
            }

            let searchMatch = !query || (doc.employee_scans || []).some(r => (r.employee_name || '').toLowerCase().includes(query));
            return dateMatch && searchMatch;
        });

        renderDocs(filtered, query);
    }

    function renderChart(labels, values) {
        const ctx = document.getElementById('employeeScanChart').getContext('2d');
        if (empChartInstance) empChartInstance.destroy();
        empChartInstance = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: labels,
                datasets: [{ data: values, backgroundColor: '#2563eb', borderRadius: 4 }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: { y: { beginAtZero: true }, x: { ticks: { font: { size: 9 } } } }
            }
        });
    }

    /* طلبات المواد - التجميع بالفروع فقط */
    let cacheMRDocs = [];
    let mrDateFilterMode = 'month';

    function openMRModal() {
        document.getElementById('mrModal').classList.add('active');
        if (cacheMRDocs.length === 0) fetchAllMR();
        else filterMRData();
    }

    function closeMRModal() {
        document.getElementById('mrModal').classList.remove('active');
    }

    async function fetchAllMR() {
        const listContainer = document.getElementById('branchSummaryList');
        listContainer.innerHTML = `<div style="text-align:center; padding:15px; font-size:11px;">جاري تحميل بيانات الفروع...</div>`;

        try {
            let allRawList = [];
            let start = 0, pageLimit = 1000, fetchedCount = pageLimit;

            while (fetchedCount === pageLimit) {
                const filters = JSON.stringify([["docstatus", "=", 1]]);
                const fields = JSON.stringify(["name", "transaction_date", "schedule_date", "set_warehouse", "docstatus"]);
                const url = `${CONFIG.serverUrl}/api/resource/Material Request?filters=${encodeURIComponent(filters)}&fields=${encodeURIComponent(fields)}&limit_start=${start}&limit_page_length=${pageLimit}&order_by=transaction_date desc`;

                const res = await fetch(url, { headers: { "Authorization": `token ${CONFIG.apiKey}:${CONFIG.apiSecret}` } });
                const data = await res.json();
                const list = data.data || [];
                allRawList = allRawList.concat(list);
                fetchedCount = list.length;
                start += pageLimit;
            }

            cacheMRDocs = [];
            const batchSize = 30;

            for (let i = 0; i < allRawList.length; i += batchSize) {
                const batch = allRawList.slice(i, i + batchSize);
                await Promise.all(batch.map(async (item) => {
                    try {
                        const resDoc = await fetch(`${CONFIG.serverUrl}/api/resource/Material Request/${encodeURIComponent(item.name)}`, {
                            headers: { "Authorization": `token ${CONFIG.apiKey}:${CONFIG.apiSecret}` }
                        });
                        if (resDoc.ok) {
                            const doc = (await resDoc.json()).data;
                            if (doc && doc.items) {
                                const mainItems = doc.items.filter(it => (it.from_warehouse || doc.set_from_warehouse || '').toLowerCase().includes('main'));
                                if (mainItems.length > 0 || (doc.set_from_warehouse && doc.set_from_warehouse.toLowerCase().includes('main'))) {
                                    cacheMRDocs.push(doc);
                                }
                            }
                        }
                    } catch (e) {}
                }));
            }

            filterMRData();
        } catch (err) {
            listContainer.innerHTML = `<div style="text-align:center; color:red; font-size:11px;">فشل جلب البيانات</div>`;
        }
    }

    function setMRDatePreset(mode, btnEl) {
        mrDateFilterMode = mode;
        btnEl.closest('.preset-grid').querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
        btnEl.classList.add('active');
        filterMRData();
    }

    function filterMRData() {
        const today = new Date();
        const todayISO = formatDateISO(today);

        let totalSum = 0, transSum = 0, pendSum = 0;
        let branchTotals = {};

        cacheMRDocs.forEach(doc => {
            const tDate = doc.transaction_date || extractDocDate(doc);
            let dateMatch = true;

            if (mrDateFilterMode === 'today') dateMatch = (tDate === todayISO);
            else if (mrDateFilterMode === 'yesterday') {
                const yest = new Date(); yest.setDate(today.getDate() - 1);
                dateMatch = (tDate === formatDateISO(yest));
            } else if (mrDateFilterMode === 'week') {
                const sevenDays = new Date(); sevenDays.setDate(today.getDate() - 7);
                dateMatch = (tDate >= formatDateISO(sevenDays) && tDate <= todayISO);
            } else if (mrDateFilterMode === 'month') {
                dateMatch = tDate.startsWith(`${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}`);
            }

            if (!dateMatch) return;

            const docTarget = doc.set_warehouse || (doc.items && doc.items[0] && doc.items[0].warehouse) || 'فرع غير محدد';

            if (!branchTotals[docTarget]) {
                branchTotals[docTarget] = { qty: 0, trans: 0, pend: 0 };
            }

            (doc.items || []).forEach(item => {
                const q = Number(item.qty || 0);
                const t = Number(item.ordered_qty || item.transferred_qty || 0);
                const p = Math.max(0, q - t);

                branchTotals[docTarget].qty += q;
                branchTotals[docTarget].trans += t;
                branchTotals[docTarget].pend += p;

                totalSum += q;
                transSum += t;
                pendSum += p;
            });
        });

        // تحديث أرقام الملخص في الأعلى
        document.getElementById('mrTotalQty').textContent = totalSum.toLocaleString('en-US');
        document.getElementById('mrTransferredQty').textContent = transSum.toLocaleString('en-US');
        document.getElementById('mrPendingQty').textContent = pendSum.toLocaleString('en-US');

        // بناء كروت الفروع
        const listContainer = document.getElementById('branchSummaryList');
        listContainer.innerHTML = '';

        const branchNames = Object.keys(branchTotals);

        if (branchNames.length === 0) {
            listContainer.innerHTML = `<div style="text-align:center; padding: 15px; color: var(--text-muted); font-size: 11px;">لا توجد طلبات مواد بالفترات المحددة.</div>`;
            return;
        }

        branchNames.sort((a,b) => branchTotals[b].qty - branchTotals[a].qty).forEach(branchName => {
            const data = branchTotals[branchName];
            const card = document.createElement('div');
            card.className = 'branch-summary-card';
            card.innerHTML = `
                <div class="branch-card-title">
                    <i class="fa-solid fa-store"></i>
                    <span>${branchName}</span>
                </div>
                <div class="branch-values-grid">
                    <div class="branch-val-box">
                        <span>المطلب</span>
                        <strong style="color:var(--brand-primary);">${data.qty.toLocaleString('en-US')}</strong>
                    </div>
                    <div class="branch-val-box">
                        <span>المحول</span>
                        <strong style="color:var(--success);">${data.trans.toLocaleString('en-US')}</strong>
                    </div>
                    <div class="branch-val-box">
                        <span>المتبقي</span>
                        <strong style="color:var(--danger);">${data.pend.toLocaleString('en-US')}</strong>
                    </div>
                </div>
            `;
            listContainer.appendChild(card);
        });
    }
</script>
</body>
</html>
