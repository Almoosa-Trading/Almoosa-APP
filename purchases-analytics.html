<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlRoot">
<head>
    <link rel="manifest" href="./manifest.json">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title data-i18n="page_title">تحليل الشحنات والمشتريات - الموسى التجارية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="style.css?v=2026.5">
    <script src="app.js" defer></script>

    <style>
        .main-container {
            width: 100%;
            max-width: 1350px;
            margin: 0 auto;
            padding: 0 15px;
        }

        header {
            display: flex !important;
            flex-direction: row !important;
            justify-content: space-between !important;
            align-items: center !important;
            flex-wrap: nowrap !important;
            gap: 6px !important;
            margin-bottom: 20px !important;
            padding: 12px 14px !important;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0284c7 100%) !important;
            color: #ffffff !important;
            border-radius: 14px !important;
            box-shadow: 0 8px 20px -4px rgba(2, 132, 199, 0.2);
            border: 2px solid #38bdf8 !important;
            position: relative;
            overflow: hidden;
        }

        header::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            background: linear-gradient(90deg, #38bdf8, #3b82f6, #10b981);
        }

        .header-title-box { flex: 1 1 auto !important; min-width: 0 !important; }
        .header-title-box h1 {
            font-size: 14px !important;
            color: #ffffff !important;
            font-weight: 800;
            white-space: nowrap !important;
            overflow: hidden !important;
            text-overflow: ellipsis !important;
            margin: 0 !important;
            line-height: 1.3;
        }
        .header-title-box p {
            font-size: 9.5px !important;
            color: #bae6fd !important;
            margin: 0 !important;
            font-weight: 600;
            white-space: nowrap !important;
            overflow: hidden !important;
            text-overflow: ellipsis !important;
        }

        .header-left-group {
            display: flex !important;
            flex-direction: row !important;
            align-items: center !important;
            flex-wrap: nowrap !important;
            gap: 4px !important;
            flex-shrink: 0 !important;
        }

        .action-btn {
            background: rgba(255, 255, 255, 0.15) !important;
            border: 1.5px solid rgba(255, 255, 255, 0.3) !important;
            width: 32px !important;
            height: 32px !important;
            border-radius: 8px !important;
            cursor: pointer;
            font-size: 13px !important;
            color: #ffffff !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            text-decoration: none;
            transition: all 0.25s;
        }
        .action-btn:hover {
            background: rgba(255, 255, 255, 0.25) !important;
            transform: translateY(-2px);
        }

        .lang-select {
            background: rgba(255, 255, 255, 0.15) !important;
            border: 1.5px solid rgba(255, 255, 255, 0.3) !important;
            padding: 0 4px !important;
            border-radius: 8px !important;
            font-size: 10px !important;
            font-weight: 700;
            color: #ffffff !important;
            height: 32px !important;
            outline: none;
            cursor: pointer;
        }
        .lang-select option { background: #1e293b; color: #ffffff; }

        /* شريط التحكم في وضع تحليل الشحنة وتغيير العرض الفوري */
        .shipment-mode-bar {
            background: var(--bg-card);
            border: 2px solid #0284c7;
            border-radius: 18px;
            padding: 18px 20px;
            margin-bottom: 20px;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .shipment-banner-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .shipment-info-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(2, 132, 199, 0.12);
            color: #0284c7;
            padding: 6px 14px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 900;
        }

        .view-switcher-tabs {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .view-tab-btn {
            border: 1.5px solid var(--border);
            background: var(--bg-body);
            color: var(--text-main);
            padding: 8px 16px;
            border-radius: 12px;
            font-family: 'Cairo', sans-serif;
            font-size: 12px;
            font-weight: 800;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }

        .view-tab-btn.active {
            background: linear-gradient(135deg, #0f172a 0%, #0284c7 100%);
            color: #ffffff;
            border-color: #0284c7;
        }

        .breakdown-table-wrap {
            overflow-x: auto;
            background: var(--bg-card);
            border: 2px solid var(--border);
            border-radius: 18px;
            padding: 16px;
            box-shadow: var(--shadow);
            margin-bottom: 25px;
        }

        .breakdown-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12.5px;
            min-width: 750px;
        }

        .breakdown-table th, .breakdown-table td {
            padding: 12px 14px;
            border-bottom: 1.5px solid var(--border);
            text-align: start;
            color: var(--text-main);
        }

        .breakdown-table th {
            background: var(--bg-body);
            font-weight: 850;
            color: var(--text-muted);
        }

        .hero-summary-card {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 50%, #0284c7 100%);
            color: white;
            border-radius: 20px;
            padding: 24px;
            margin-bottom: 25px;
            box-shadow: 0 15px 35px -8px rgba(2, 132, 199, 0.45);
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            border: 2px solid #38bdf8;
        }

        .hero-stat-box { display: flex; flex-direction: column; gap: 4px; }
        .hero-stat-box label { font-size: 11px; color: #bae6fd; font-weight: 700; }
        .hero-stat-box span { font-size: 18px; font-weight: 800; }

        .status-msg { text-align: center; padding: 30px; color: var(--text-muted); font-size: 13px; font-weight: 700; }

        @media (min-width: 768px) {
            header { padding: 20px 28px !important; }
            .header-title-box h1 { font-size: 18px !important; }
            .header-title-box p { font-size: 11.5px !important; }
            .action-btn { width: 44px !important; height: 44px !important; font-size: 16px !important; border-radius: 14px !important; }
            .lang-select { height: 44px !important; font-size: 12px !important; padding: 0 14px !important; border-radius: 14px !important; }
            .hero-summary-card { grid-template-columns: repeat(4, 1fr) !important; }
        }
    </style>
</head>
<body data-theme="light">

<div class="main-container">
    <header>
        <div class="header-title-box">
            <h1 data-i18n="header_title">الموسى التجارية</h1>
            <p id="headerSubTitle" data-i18n="header_subtitle">تحليل الشحنات والمشتريات</p>
        </div>
        <div class="header-left-group">
            <button class="action-btn" id="themeToggleBtn" onclick="toggleTheme()" title="تغيير المظهر">
                <i class="fa-solid fa-moon" id="themeIcon"></i>
            </button>
            <select id="langSelect" class="lang-select" onchange="changeLanguage(this.value)">
                <option value="ar">العربية</option>
                <option value="en">English</option>
                <option value="hi">हिन्दी</option>
                <option value="ur">اردو</option>
            </select>
            <a href="purchases.html" class="action-btn" title="العودة للشحنات">
                <i class="fa-solid fa-arrow-right"></i>
            </a>
            <a href="index.html" class="action-btn" title="الرئيسية">
                <i class="fa-solid fa-house"></i>
            </a>
        </div>
    </header>

    <!-- قسم تحليل تفاصيل الشحنة -->
    <div id="shipmentBreakdownSection">
        <div class="shipment-mode-bar">
            <div class="shipment-banner-top">
                <div class="shipment-info-pill" id="shipmentBannerDetails">
                    <i class="fa-solid fa-ship"></i> تحليل الشحنة
                </div>
                <div class="view-switcher-tabs">
                    <button class="view-tab-btn" id="tab-variants" onclick="switchShipmentView('variants')">
                        <i class="fa-solid fa-shirt"></i> عرض الموديل (Model)
                    </button>
                    <button class="view-tab-btn" id="tab-groups" onclick="switchShipmentView('groups')">
                        <i class="fa-solid fa-folder-tree"></i> عرض المجموعة (Sub Group)
                    </button>
                    <button class="view-tab-btn" id="tab-items" onclick="switchShipmentView('items')">
                        <i class="fa-solid fa-box"></i> عرض الصنف (Item)
                    </button>
                </div>
            </div>
        </div>

        <div class="hero-summary-card">
            <div class="hero-stat-box">
                <label>إجمالي المستلم (Received Qty)</label>
                <span id="shipKpiRec">0 Pcs</span>
            </div>
            <div class="hero-stat-box">
                <label>إجمالي التكلفة (PO Cost)</label>
                <span id="shipKpiCost">0.00 SAR</span>
            </div>
            <div class="hero-stat-box">
                <label>إجمالي المباع (Sold Qty)</label>
                <span id="shipKpiSold">0 Pcs</span>
            </div>
            <div class="hero-stat-box">
                <label>حجم المبيعات (Sales Volume)</label>
                <span id="shipKpiSalesVol">0.00 SAR</span>
            </div>
        </div>

        <div class="breakdown-table-wrap">
            <div id="shipmentStatusMsg" class="status-msg">جاري تحميل بيانات الشحنة...</div>
            <table class="breakdown-table" id="shipmentBreakdownTable" style="display: none;">
                <thead>
                    <tr>
                        <th id="thColCode">الكود</th>
                        <th id="thColName">التفاصيل</th>
                        <th id="thColSubGroup">المجموعة (Group)</th>
                        <th>المستلم (Received)</th>
                        <th>التكلفة (Cost)</th>
                        <th>المباع (Sold)</th>
                        <th>نسبة التصريف</th>
                        <th>حجم المبيعات</th>
                    </tr>
                </thead>
                <tbody id="shipmentBreakdownBody"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    const CONFIG = {
        serverUrl: "https://87-237-225-155.nip.io",
        apiKey: "6f039a5a6130b79",
        apiSecret: "9e6d920a8fda252"
    };

    const urlParams = new URLSearchParams(window.location.search);
    const paramShipment = urlParams.get('shipment') || '';
    const paramSupplier = urlParams.get('supplier') || '';
    const paramBrand = urlParams.get('brand') || '';
    const paramSeason = urlParams.get('season') || 'all';
    let currentViewType = urlParams.get('view_type') || 'items';

    document.addEventListener('DOMContentLoaded', () => {
        document.getElementById('headerSubTitle').textContent = `تحليل تفصيلي للشحنة: ${paramShipment || 'الكل'}`;
        switchShipmentView(currentViewType);
    });

    function switchShipmentView(viewType) {
        currentViewType = viewType;
        document.querySelectorAll('.view-tab-btn').forEach(b => b.classList.remove('active'));
        const activeBtn = document.getElementById(`tab-${viewType}`);
        if (activeBtn) activeBtn.classList.add('active');

        const viewNames = {
            'variants': 'مستوى الموديل (Model Number)',
            'groups': 'مستوى المجموعة الفرعية (Sub Group)',
            'items': 'مستوى الصنف الفردي (Item)'
        };
        
        document.getElementById('shipmentBannerDetails').innerHTML = `
            <i class="fa-solid fa-ship"></i> 
            الشحنة: ${paramShipment || '-'} | المورد: ${paramSupplier || 'الكل'} | العرض: ${viewNames[viewType] || viewType}
        `;

        if (viewType === 'variants') {
            document.getElementById('thColCode').textContent = 'رقم الموديل (Model Code)';
            document.getElementById('thColName').textContent = 'اسم النموذج / المجموعة';
            document.getElementById('thColSubGroup').textContent = 'المجموعة';
        } else if (viewType === 'groups') {
            document.getElementById('thColCode').textContent = 'المجموعة (Group)';
            document.getElementById('thColName').textContent = 'البراند (Brand)';
            document.getElementById('thColSubGroup').textContent = 'ملاحظات';
        } else {
            document.getElementById('thColCode').textContent = 'كود الصنف (Item Code)';
            document.getElementById('thColName').textContent = 'اسم الصنف (Item Name)';
            document.getElementById('thColSubGroup').textContent = 'المجموعة (Group)';
        }

        loadShipmentBreakdown(viewType);
    }

    async function loadShipmentBreakdown(viewType) {
        const statusMsg = document.getElementById('shipmentStatusMsg');
        const table = document.getElementById('shipmentBreakdownTable');
        const tbody = document.getElementById('shipmentBreakdownBody');

        statusMsg.style.display = 'block';
        statusMsg.textContent = 'جاري جلب تفاصيل الشحنة من السيرفر...';
        table.style.display = 'none';

        try {
            const queryParams = new URLSearchParams({
                shipment: paramShipment,
                supplier: paramSupplier,
                brand: paramBrand,
                season: paramSeason,
                view_type: viewType
            });

            const res = await fetch(`${CONFIG.serverUrl}/api/method/get_shipment_breakdown?${queryParams.toString()}`, {
                method: "GET",
                headers: {
                    "Authorization": `token ${CONFIG.apiKey}:${CONFIG.apiSecret}`
                }
            });

            if (res.ok) {
                const json = await res.json();
                const rows = json.message || [];

                let totRec = 0, totCost = 0, totSold = 0, totSalesVol = 0;
                rows.forEach(r => {
                    totRec += parseFloat(r.received_qty || 0);
                    totCost += parseFloat(r.cost || 0);
                    totSold += parseFloat(r.sold_qty || 0);
                    totSalesVol += parseFloat(r.sales_vol || 0);
                });

                document.getElementById('shipKpiRec').textContent = `${totRec.toLocaleString('en-US')} Pcs`;
                document.getElementById('shipKpiCost').textContent = `${totCost.toLocaleString('en-US', {minimumFractionDigits: 2})} SAR`;
                document.getElementById('shipKpiSold').textContent = `${totSold.toLocaleString('en-US')} Pcs`;
                document.getElementById('shipKpiSalesVol').textContent = `${totSalesVol.toLocaleString('en-US', {minimumFractionDigits: 2})} SAR`;

                if (rows.length === 0) {
                    statusMsg.textContent = 'لا توجد بيانات مسجلة لهذه الشحنة بالفلاتر المحددة.';
                    return;
                }

                tbody.innerHTML = '';
                rows.forEach(r => {
                    const rec = parseFloat(r.received_qty || 0);
                    const sold = parseFloat(r.sold_qty || 0);
                    const pct = rec > 0 ? Math.min(100, Math.round((sold / rec) * 100)) : 0;
                    const color = pct >= 70 ? '#10b981' : (pct >= 40 ? '#f59e0b' : '#ef4444');

                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td><strong>${r.code || '-'}</strong></td>
                        <td>${r.name || '-'}</td>
                        <td>${r.group || '-'}</td>
                        <td><span style="color:#059669; font-weight:800;">${rec.toLocaleString('en-US')} Pcs</span></td>
                        <td>${parseFloat(r.cost || 0).toLocaleString('en-US', {minimumFractionDigits: 2})} SAR</td>
                        <td><strong>${sold.toLocaleString('en-US')} Pcs</strong></td>
                        <td><strong style="color:${color};">${pct}%</strong></td>
                        <td><strong style="color:#7c3aed;">${parseFloat(r.sales_vol || 0).toLocaleString('en-US', {minimumFractionDigits: 2})} SAR</strong></td>
                    `;
                    tbody.appendChild(tr);
                });

                statusMsg.style.display = 'none';
                table.style.display = 'table';
            } else {
                statusMsg.textContent = 'حدث خطأ أثناء جلب بيانات التحليل من السيرفر.';
            }
        } catch (err) {
            console.error(err);
            statusMsg.textContent = 'تعذر الاتصال بالسيرفر.';
        }
    }
</script>
</body>
</html>
