<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlRoot">
<head>
    <link rel="manifest" href="./manifest.json">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title data-i18n="sales_group_title">مبيعات المجموعات - الموسى التجارية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css?v=2026.5">
    <style>
        .mobile-container {
            width: 100%;
            max-width: 1350px;
            margin: 0 auto;
            padding: 0 15px;
        }

        /* 📱 ترويسة ثابتة وموحدة تضمن بقاء الأزرار في سطر واحد على الجوال */
        header {
            display: flex !important;
            flex-direction: row !important;
            justify-content: space-between !important;
            align-items: center !important;
            flex-wrap: nowrap !important;
            gap: 6px !important;
            margin-bottom: 20px !important;
            padding: 12px 14px !important;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0284c7 100%) !important;
            color: #ffffff !important;
            border-radius: 14px !important;
            box-shadow: 0 8px 20px -4px rgba(2, 132, 199, 0.2);
            border: 2px solid #38bdf8 !important;
            position: relative;
            overflow: hidden;
        }

        header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, #38bdf8, #3b82f6, #10b981);
        }

        .header-title-box {
            flex: 1 1 auto !important;
            min-width: 0 !important;
        }

        .header-title-box h1 {
            font-size: 14px !important;
            color: #ffffff !important;
            font-weight: 800;
            white-space: nowrap !important;
            overflow: hidden !important;
            text-overflow: ellipsis !important;
            margin: 0 !important;
            line-height: 1.3;
        }

        .header-title-box p {
            font-size: 9.5px !important;
            color: #bae6fd !important;
            margin: 0 !important;
            font-weight: 600;
            white-space: nowrap !important;
            overflow: hidden !important;
            text-overflow: ellipsis !important;
        }

        .header-left-group {
            display: flex !important;
            flex-direction: row !important;
            align-items: center !important;
            flex-wrap: nowrap !important;
            gap: 4px !important;
            flex-shrink: 0 !important;
            width: auto !important;
        }

        .update-btn {
            background: rgba(255, 255, 255, 0.15) !important;
            border: 1.5px solid rgba(255, 255, 255, 0.3) !important;
            width: 32px !important;
            height: 32px !important;
            min-width: 32px !important;
            max-width: 32px !important;
            border-radius: 8px !important;
            cursor: pointer;
            font-size: 13px !important;
            color: #ffffff !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            text-decoration: none;
            padding: 0 !important;
            margin: 0 !important;
            flex-shrink: 0 !important;
            transition: all 0.25s;
        }
        .update-btn:hover {
            background: rgba(255, 255, 255, 0.25) !important;
            border-color: #ffffff !important;
            transform: translateY(-2px);
        }

        .lang-select {
            background: rgba(255, 255, 255, 0.15) !important;
            border: 1.5px solid rgba(255, 255, 255, 0.3) !important;
            padding: 0 4px !important;
            border-radius: 8px !important;
            font-size: 10px !important;
            font-weight: 700;
            color: #ffffff !important;
            height: 32px !important;
            outline: none;
            cursor: pointer;
            margin: 0 !important;
            flex-shrink: 0 !important;
            width: auto !important;
        }
        .lang-select option {
            background: #1e293b;
            color: #ffffff;
        }

        .filter-panel {
            background: var(--bg-card);
            padding: 24px;
            border-radius: 18px;
            box-shadow: var(--shadow);
            margin-bottom: 25px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            border: 2px solid var(--border);
        }

        .controls-row {
            display: grid;
            grid-template-columns: 1fr;
            gap: 14px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            position: relative;
        }

        .control-label {
            font-size: 12px;
            font-weight: 700;
            color: var(--text-muted);
        }

        .date-toggle-btn, .multi-select-btn {
            background: var(--bg-body);
            border: 2px solid var(--border);
            padding: 10px 14px;
            border-radius: 14px;
            font-size: 12px;
            font-weight: 700;
            color: var(--text-main);
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            height: 44px;
            width: 100%;
        }

        .multi-select-dropdown {
            position: relative;
            width: 100%;
        }

        .multi-select-content {
            display: none;
            position: absolute;
            top: 50px;
            right: 0;
            width: 100%;
            background: var(--bg-card);
            border: 2px solid var(--border);
            border-radius: 14px;
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.15);
            max-height: 220px;
            overflow-y: auto;
            z-index: 100;
            padding: 10px;
        }
        .multi-select-content.open { display: block; }

        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 10px;
            font-size: 11.5px;
            font-weight: 700;
            cursor: pointer;
            border-radius: 8px;
            color: var(--text-main);
        }
        .checkbox-item:hover { background: var(--bg-body); }

        .calendar-container {
            border: 2px solid var(--border);
            border-radius: 14px;
            padding: 14px;
            background: var(--bg-card);
            display: none;
            position: absolute;
            top: 50px;
            right: 0;
            width: 100%;
            max-width: 350px;
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.15);
            z-index: 1000;
        }
        .calendar-container.open { display: block; }
        .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-size: 13px; font-weight: 800; color: var(--text-main); }
        .calendar-header button { background: none; border: 2px solid var(--border); border-radius: 8px; padding: 6px 10px; cursor: pointer; color: var(--text-main); font-weight: 700; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; text-align: center; }
        .calendar-day-name { font-size: 11px; color: var(--text-muted); font-weight: 800; }
        .calendar-day { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; background: var(--bg-body); border-radius: 8px; cursor: pointer; color: var(--text-main); border: 1px solid var(--border); }
        .calendar-day.selected { background: var(--accent); color: white; border-color: var(--accent); }
        .calendar-day.in-range { background: var(--accent-light); color: var(--accent); }

        .period-chips {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .chip {
            background: var(--accent-light);
            border: 2px solid var(--accent-border);
            padding: 10px 6px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 700;
            text-align: center;
            cursor: pointer;
            color: var(--accent);
        }
        .chip.active {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        .hero-summary-card {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 50%, #0284c7 100%);
            color: white;
            border-radius: 20px;
            padding: 24px;
            margin-bottom: 25px;
            box-shadow: 0 15px 35px -8px rgba(2, 132, 199, 0.45);
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            border: 2px solid #38bdf8;
        }

        .hero-stat-box {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .hero-stat-box label {
            font-size: 11px;
            color: #bae6fd;
            font-weight: 700;
        }

        .hero-stat-box span {
            font-size: 18px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .report-section {
            background: var(--bg-card);
            border-radius: 18px;
            padding: 24px;
            box-shadow: var(--shadow);
            margin-bottom: 25px;
            border: 2px solid var(--border);
        }

        .section-title {
            font-size: 15px;
            font-weight: 800;
            color: var(--text-main);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* 🎯 توزيع البطاقات في 3 أعمدة رئيسية */
        .analytics-container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
        }

        .group-card {
            background: var(--bg-body);
            border: 2px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 100%;
            transition: all 0.25s ease;
        }
        .group-card:hover {
            border-color: var(--accent);
            box-shadow: 0 10px 25px rgba(37, 99, 235, 0.12);
        }

        .group-header {
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 16px 18px;
            font-size: 14px;
            font-weight: 800;
            color: var(--text-main);
            cursor: pointer;
            background: var(--bg-card);
            border-bottom: 2px solid var(--border);
        }

        .group-title-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .group-qty-badge {
            background: rgba(37, 99, 235, 0.1);
            color: var(--accent);
            border: 1px solid var(--accent-border);
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 800;
        }

        .group-totals-badge {
            font-size: 11px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 6px;
        }

        .group-totals-badge span {
            padding: 6px 10px;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            gap: 2px;
            font-weight: 700;
            border: 1px solid transparent;
        }
        .group-totals-badge span.box-sales { background: rgba(37, 99, 235, 0.08); color: #1d4ed8; border-color: rgba(37, 99, 235, 0.2); }
        .group-totals-badge span.box-novat { background: rgba(14, 165, 233, 0.08); color: #0369a1; border-color: rgba(14, 165, 233, 0.2); }
        .group-totals-badge span.box-cost { background: rgba(234, 88, 12, 0.08); color: #c2410c; border-color: rgba(234, 88, 12, 0.2); }
        .group-totals-badge span.box-margin { background: rgba(16, 185, 129, 0.08); color: #047857; border-color: rgba(16, 185, 129, 0.2); }

        .group-totals-badge span label { font-size: 9.5px; opacity: 0.85; }
        .group-totals-badge span b { font-size: 12px; font-weight: 900; }

        .group-body {
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: var(--bg-body);
            flex-grow: 1;
        }

        .gender-accordion {
            background: var(--bg-card);
            border: 1.5px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
        }

        .gender-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 14px;
            font-size: 12px;
            font-weight: 800;
            cursor: pointer;
        }
        .gender-header.men { color: #2563eb; background: rgba(37, 99, 235, 0.06); }
        .gender-header.woman { color: #db2777; background: rgba(219, 39, 119, 0.06); }
        .gender-header.unisex { color: #059669; background: rgba(5, 150, 105, 0.06); }

        .gender-body {
            display: none;
            padding: 10px 12px;
            flex-direction: column;
            gap: 8px;
            border-top: 1.5px solid var(--border);
            background: var(--bg-body);
        }
        .gender-accordion.open .gender-body { display: flex; }

        /* 🎨 شبكة مربعات الموردين */
        .suppliers-grid-box {
            display: grid;
            grid-template-columns: 1fr;
            gap: 8px;
        }

        .supplier-item-card {
            background: var(--bg-card);
            border: 1.5px solid var(--border);
            border-radius: 10px;
            padding: 10px 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            transition: all 0.2s;
        }
        .supplier-item-card:hover {
            border-color: var(--accent);
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.08);
        }

        .supplier-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11.5px;
            font-weight: 900;
            color: var(--text-main);
            border-bottom: 1px solid var(--border);
            padding-bottom: 6px;
        }

        .supplier-card-metrics {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
        }

        .metric-cell {
            border-radius: 6px;
            padding: 6px 8px;
            display: flex;
            flex-direction: column;
            gap: 2px;
            border: 1px solid transparent;
        }
        .metric-cell.m-cost { background: rgba(234, 88, 12, 0.06); border-color: rgba(234, 88, 12, 0.15); color: #c2410c; }
        .metric-cell.m-margin { background: rgba(16, 185, 129, 0.06); border-color: rgba(16, 185, 129, 0.15); color: #047857; }
        .metric-cell.m-qty { background: rgba(37, 99, 235, 0.06); border-color: rgba(37, 99, 235, 0.15); color: #1d4ed8; }

        .metric-cell label {
            font-size: 9px;
            opacity: 0.85;
            font-weight: 700;
        }
        .metric-cell span {
            font-size: 11px;
            font-weight: 900;
        }

        .status-msg {
            text-align: center;
            padding: 35px;
            color: var(--text-muted);
            font-size: 13px;
            font-weight: 700;
        }

        /* 💻 التجاوب الدقيق للشاشات الكبيرة */
        @media (min-width: 768px) {
            header {
                padding: 20px 28px !important;
            }
            .header-title-box h1 {
                font-size: 18px !important;
            }
            .header-title-box p {
                font-size: 11.5px !important;
            }
            .update-btn {
                width: 44px !important;
                height: 44px !important;
                min-width: 44px !important;
                font-size: 16px !important;
                border-radius: 14px !important;
            }
            .lang-select {
                height: 44px !important;
                font-size: 12px !important;
                padding: 0 14px !important;
                border-radius: 14px !important;
            }
            .header-left-group {
                gap: 10px !important;
            }
            .mobile-container {
                max-width: 1400px !important;
                padding: 0 20px;
            }
            .filter-panel .period-chips { grid-template-columns: repeat(6, 1fr) !important; }
            .controls-row { grid-template-columns: repeat(3, 1fr) !important; }
            .analytics-container { 
                grid-template-columns: repeat(3, 1fr) !important; 
                gap: 20px !important; 
            }
            .hero-summary-card { grid-template-columns: repeat(5, 1fr) !important; }
            .suppliers-grid-box { grid-template-columns: repeat(1, 1fr) !important; }
        }
    </style>
    <script src="app.js" defer></script>
</head>
<body data-theme="light">

<div class="mobile-container">
    <header>
        <div class="header-title-box">
            <h1>الموسى التجارية</h1>
            <p>تقرير مبيعات المجموعات الاحترافي</p>
        </div>
        <div class="header-left-group">
            <button class="update-btn" id="themeToggleBtn" onclick="toggleTheme()" title="تغيير المظهر">
                <i class="fa-solid fa-moon" id="themeIcon"></i>
            </button>
            <select id="langSelect" class="lang-select" onchange="changeLanguage(this.value)">
                <option value="ar">العربية</option>
                <option value="en">English</option>
                <option value="hi">हिन्दी</option>
                <option value="ur">اردو</option>
            </select>
            <button class="update-btn" onclick="loadGroupSalesData()" title="تحديث">
                <i class="fa-solid fa-rotate"></i>
            </button>
            <a href="sales.html" class="update-btn" title="الرجوع للمبيعات">
                <i class="fa-solid fa-arrow-right"></i>
            </a>
        </div>
    </header>

    <div class="filter-panel">
        <div class="period-chips">
            <div class="chip" data-preset="today" onclick="setPreset('today', this)">اليوم</div>
            <div class="chip" data-preset="yesterday" onclick="setPreset('yesterday', this)">أمس</div>
            <div class="chip" data-preset="week" onclick="setPreset('week', this)">الأسبوع</div>
            <div class="chip" data-preset="month" onclick="setPreset('month', this)">الشهر</div>
            <div class="chip" data-preset="year" onclick="setPreset('year', this)">السنة</div>
            <div class="chip" data-preset="custom" onclick="toggleCalendar()">📅 مخصص</div>
        </div>

        <div class="controls-row">
            <div class="control-group">
                <span class="control-label">النطاق الزمني:</span>
                <div class="date-toggle-btn" onclick="toggleCalendar()">
                    <span id="dateButtonText">اختر النطاق...</span>
                    <span>▼</span>
                </div>
                <div class="calendar-container" id="calendarContainer" onclick="event.stopPropagation()">
                    <div class="calendar-header">
                        <button onclick="changeMonth(-1)">&#9664;</button>
                        <span id="calendarTitle">أكتوبر 2026</span>
                        <button onclick="changeMonth(1)">&#9654;</button>
                    </div>
                    <div class="calendar-grid" id="calendarDaysGrid"></div>
                </div>
            </div>

            <div class="control-group">
                <span class="control-label">الفرع (Branch):</span>
                <div class="multi-select-dropdown">
                    <div class="multi-select-btn" onclick="toggleDropdown('branchContent')">
                        <span id="branchBtnText">الكل مختار</span>
                        <span>▼</span>
                    </div>
                    <div class="multi-select-content" id="branchContent"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- كارت الإحصائيات الرئيسي -->
    <div class="hero-summary-card">
        <div class="hero-stat-box">
            <label>إجمالي المبيعات</label>
            <span id="kpiTotalSales">0.00 SAR</span>
        </div>
        <div class="hero-stat-box">
            <label>بدون ضريبة (Excl. VAT)</label>
            <span id="kpiWithoutVat">0.00 SAR</span>
        </div>
        <div class="hero-stat-box">
            <label>إجمالي التكلفة (Cost)</label>
            <span id="kpiTotalCost">0.00 SAR</span>
        </div>
        <div class="hero-stat-box">
            <label>هامش الربح (Margin)</label>
            <span id="kpiMargin">0.00%</span>
        </div>
        <div class="hero-stat-box">
            <label>إجمالي القطع</label>
            <span id="kpiTotalQty">0 Pcs</span>
        </div>
    </div>

    <div class="report-section">
        <div class="section-title">
            <i class="fa-solid fa-layer-group" style="color: var(--accent);"></i> تفصيل المبيعات حسب المجموعات والموردين (3 أقسام رئيسية)
        </div>
        <div class="analytics-container" id="groupAnalyticsContainer">
            <div class="status-msg">جاري تحميل البيانات وتحليل المجموعات...</div>
        </div>
    </div>
</div>

<script>
    const CONFIG = {
        serverUrl: "https://87-237-225-155.nip.io/",
        apiKey: "6f039a5a6130b79",
        apiSecret: "9e6d920a8fda252"
    };

    let rawGroupData = [];
    let currentQueryFrom = '';
    let currentQueryTo = '';
    let selectionState = { startDate: null, endDate: null };
    let viewDate = new Date();

    document.addEventListener('DOMContentLoaded', () => {
        syncWithSalesPageFilter();
        renderCalendar();

        window.onclick = function(event) {
            if (!event.target.closest('.control-group') && !event.target.closest('.period-chips') && !event.target.closest('.multi-select-dropdown')) {
                document.getElementById('calendarContainer').classList.remove('open');
                document.querySelectorAll('.multi-select-content').forEach(el => el.classList.remove('open'));
            }
        }
    });

    function toggleDropdown(id) {
        document.querySelectorAll('.multi-select-content').forEach(el => {
            if (el.id !== id) el.classList.remove('open');
        });
        document.getElementById(id).classList.toggle('open');
    }

    function syncWithSalesPageFilter() {
        const salesPreset = localStorage.getItem('sales_filter_preset');
        const salesFrom = localStorage.getItem('sales_filter_from');
        const salesTo = localStorage.getItem('sales_filter_to');

        if (salesPreset && salesPreset !== 'custom') {
            const targetChip = document.querySelector(`.chip[data-preset="${salesPreset}"]`);
            setPreset(salesPreset, targetChip, false);
        } else if (salesFrom && salesTo) {
            currentQueryFrom = salesFrom;
            currentQueryTo = salesTo;
            selectionState.startDate = salesFrom;
            selectionState.endDate = salesTo;
            document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
            const customChip = document.querySelector('.chip[data-preset="custom"]');
            if (customChip) customChip.classList.add('active');
            document.getElementById('dateButtonText').textContent = currentQueryFrom === currentQueryTo ? currentQueryFrom : `${currentQueryFrom} إلى ${currentQueryTo}`;
            loadGroupSalesData();
        } else {
            setPreset('today', document.querySelector('.chip[data-preset="today"]'), false);
        }
    }

    function toggleCalendar() {
        document.getElementById('calendarContainer').classList.toggle('open');
    }

    function changeMonth(direction) {
        viewDate.setMonth(viewDate.getMonth() + direction);
        renderCalendar();
    }

    function renderCalendar() {
        const grid = document.getElementById('calendarDaysGrid');
        const titleEl = document.getElementById('calendarTitle');
        if (!grid || !titleEl) return;
        grid.innerHTML = '';
        const year = viewDate.getFullYear();
        const month = viewDate.getMonth();
        const arMonths = ["يناير", "فبراير", "مارس", "إبريل", "مايو", "يونيو", "يوليو", "أغسطس", "سبتمبر", "أكتوبر", "نوفمبر", "ديسمبر"];
        titleEl.textContent = `${arMonths[month]} ${year}`;

        const daysShort = ['أحد', 'إثن', 'ثلا', 'أرب', 'خميس', 'جمع', 'سبت'];
        daysShort.forEach(d => {
            const div = document.createElement('div');
            div.className = 'calendar-day-name';
            div.textContent = d;
            grid.appendChild(div);
        });

        const firstDayIndex = new Date(year, month, 1).getDay();
        const totalDays = new Date(year, month + 1, 0).getDate();

        for (let i = 0; i < firstDayIndex; i++) {
            grid.appendChild(document.createElement('div'));
        }

        for (let day = 1; day <= totalDays; day++) {
            const dayDiv = document.createElement('div');
            dayDiv.className = 'calendar-day';
            dayDiv.textContent = day;
            const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
            
            if (selectionState.startDate && dateStr === selectionState.startDate) dayDiv.classList.add('selected');
            if (selectionState.endDate && dateStr === selectionState.endDate) dayDiv.classList.add('selected');
            if (selectionState.startDate && selectionState.endDate && dateStr > selectionState.startDate && dateStr < selectionState.endDate) dayDiv.classList.add('in-range');

            dayDiv.onclick = (e) => { e.stopPropagation(); onCalendarDayClick(dateStr); };
            grid.appendChild(dayDiv);
        }
    }

    function onCalendarDayClick(dateStr) {
        document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
        const customChip = document.querySelector('.chip[data-preset="custom"]');
        if (customChip) customChip.classList.add('active');

        if (!selectionState.startDate || (selectionState.startDate && selectionState.endDate)) {
            selectionState.startDate = dateStr;
            selectionState.endDate = null;
            currentQueryFrom = dateStr;
            currentQueryTo = '';
            document.getElementById('dateButtonText').textContent = `${currentQueryFrom} (اختر نهاية الفترة)`;
            renderCalendar();
        } else {
            if (dateStr < selectionState.startDate) {
                selectionState.startDate = dateStr;
                currentQueryFrom = dateStr;
                currentQueryTo = '';
                document.getElementById('dateButtonText').textContent = `${currentQueryFrom} (اختر نهاية الفترة)`;
                renderCalendar();
            } else {
                selectionState.endDate = dateStr;
                currentQueryTo = dateStr;
                
                localStorage.setItem('sales_filter_preset', 'custom');
                localStorage.setItem('sales_filter_from', currentQueryFrom);
                localStorage.setItem('sales_filter_to', currentQueryTo);

                document.getElementById('dateButtonText').textContent = `${currentQueryFrom} إلى ${currentQueryTo}`;
                renderCalendar();
                loadGroupSalesData();
                toggleCalendar();
            }
        }
    }

    function setPreset(type, element, updateLocalStorage = true) {
        if (element) {
            document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
            element.classList.add('active');
        }
        const today = new Date();
        let start = new Date(), end = new Date();
        if (type === 'today') { start = new Date(today); end = new Date(today); }
        else if (type === 'yesterday') { start = new Date(today); start.setDate(today.getDate() - 1); end = new Date(start); }
        else if (type === 'week') { start = new Date(today); start.setDate(today.getDate() - 6); end = new Date(today); }
        else if (type === 'month') { start = new Date(today.getFullYear(), today.getMonth(), 1); end = new Date(today); }
        else if (type === 'year') { start = new Date(today.getFullYear(), 0, 1); end = new Date(today); }

        currentQueryFrom = formatDateStr(start);
        currentQueryTo = formatDateStr(end);
        selectionState.startDate = currentQueryFrom;
        selectionState.endDate = currentQueryTo;
        viewDate = new Date(end);

        if (updateLocalStorage) {
            localStorage.setItem('sales_filter_preset', type);
            localStorage.setItem('sales_filter_from', currentQueryFrom);
            localStorage.setItem('sales_filter_to', currentQueryTo);
        }

        document.getElementById('dateButtonText').textContent = currentQueryFrom === currentQueryTo ? currentQueryFrom : `${currentQueryFrom} إلى ${currentQueryTo}`;
        renderCalendar();
        loadGroupSalesData();
    }

    function formatDateStr(d) {
        return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }

    async function loadGroupSalesData() {
        const container = document.getElementById('groupAnalyticsContainer');
        container.innerHTML = `<div class="status-msg"><i class="fa-solid fa-spinner fa-spin"></i> جاري تحميل البيانات...</div>`;
        rawGroupData = [];

        try {
            const res = await fetch(`${CONFIG.serverUrl}/api/method/get_supplier_sales_summary?from_date=${currentQueryFrom}&to_date=${currentQueryTo}`, {
                method: "GET",
                headers: {
                    "Authorization": `token ${CONFIG.apiKey}:${CONFIG.apiSecret}`,
                    "X-Frappe-Site-Name": window.location.hostname
                }
            });

            if (res.ok) {
                const jsonRes = await res.json();
                const fetchedRows = jsonRes.message?.data || jsonRes.message || [];
                
                rawGroupData = fetchedRows.map(row => {
                    const itemGrp = row.item_group || "";
                    const parts = itemGrp.split('.');
                    let group = row.group || row.Group || (parts.length >= 4 ? parts[3] : (parts.length > 0 ? parts[parts.length - 1] : "غير محدد"));
                    
                    const totalSales = parseFloat(row.total_sales || row.Total_Sales || row.sales || 0);
                    const salesWithoutVat = row.sales_without_vat !== undefined ? parseFloat(row.sales_without_vat) : (totalSales / 1.15);
                    
                    let cost = parseFloat(row.total_cost || row.Total_Cost || row.cost || row.Cost || 0);
                    if (cost === 0 && salesWithoutVat > 0) {
                        cost = salesWithoutVat * 0.60; 
                    }

                    return {
                        supplier: row.supplier || row.Supplier || "مورد غير محدد",
                        branch: row.branch || row.Branch || row.warehouse || row.pos_profile || "فرع رئيسي",
                        item_group: itemGrp,
                        group: group,
                        gender: row.gender || row.Gender || "",
                        dcs_code: row.dcs_code || row.DCS_Code || "",
                        total_sales: totalSales,
                        sales_without_vat: salesWithoutVat,
                        total_cost: cost,
                        total_qty: parseFloat(row.total_qty || row.Total_Qty || row.qty || 0)
                    };
                });
            } else {
                container.innerHTML = `<div class="status-msg">فشل الاتصال بالخادم</div>`;
            }
        } catch (err) {
            console.error("API Error:", err);
            container.innerHTML = `<div class="status-msg">حدث خطأ أثناء جلب البيانات</div>`;
        }

        populateBranchDropdown();
        processAndRenderGroups();
    }

    function populateBranchDropdown() {
        const branchSet = new Set();
        rawGroupData.forEach(row => { if (row.branch) branchSet.add(row.branch); });
        
        const container = document.getElementById('branchContent');
        container.innerHTML = '';
        
        const allDiv = document.createElement('label');
        allDiv.className = 'checkbox-item';
        allDiv.innerHTML = `<input type="checkbox" checked onchange="toggleSelectAllBranches(this)"> <b>تحديد الكل</b>`;
        container.appendChild(allDiv);

        Array.from(branchSet).sort().forEach(val => {
            const lbl = document.createElement('label');
            lbl.className = 'checkbox-item';
            lbl.innerHTML = `<input type="checkbox" value="${val}" checked onchange="updateBranchButtonText()"> ${val}`;
            container.appendChild(lbl);
        });
        updateBranchButtonText();
    }

    function toggleSelectAllBranches(master) {
        document.querySelectorAll('#branchContent input[type="checkbox"]').forEach(cb => cb.checked = master.checked);
        updateBranchButtonText();
        processAndRenderGroups();
    }

    function updateBranchButtonText() {
        const checkboxes = document.querySelectorAll('#branchContent input[type="checkbox"]');
        const checked = Array.from(checkboxes).filter(cb => cb.checked && cb.value !== "on");
        const btnText = document.getElementById('branchBtnText');
        if (checked.length === 0 || checked.length === checkboxes.length - 1) {
            btnText.textContent = "الكل مختار";
        } else {
            btnText.textContent = `مختار (${checked.length})`;
        }
        processAndRenderGroups();
    }

    function getSelectedBranches() {
        const checkboxes = document.querySelectorAll('#branchContent input[type="checkbox"]');
        return Array.from(checkboxes).filter(cb => cb.checked && cb.value !== "on").map(cb => cb.value);
    }

    function processAndRenderGroups() {
        const selBranches = getSelectedBranches();
        let filtered = rawGroupData.filter(row => selBranches.length === 0 || selBranches.includes(row.branch));

        let groupMap = {};
        let grandSales = 0, grandWithoutVat = 0, grandCost = 0, grandQty = 0;

        filtered.forEach(row => {
            const supplier = row.supplier;
            const itemGrp = row.item_group;
            let group = row.group;
            
            let genderKey = 'Unisex';
            const strCheck = `${row.gender} ${itemGrp} ${row.dcs_code}`.toUpperCase();
            if (strCheck.includes('WOMAN') || strCheck.includes('WOMEN') || strCheck.includes('WMN') || strCheck.includes('FEMALE') || strCheck.includes('WMS')) {
                genderKey = 'Woman';
            } else if (strCheck.includes('MAN') || strCheck.includes('MEN') || strCheck.includes('BOY') || strCheck.includes('MENS') || strCheck.includes('MALE')) {
                genderKey = 'Man';
            }

            const sales = row.total_sales;
            const withoutVat = row.sales_without_vat;
            const cost = row.total_cost;
            const qty = row.total_qty;

            grandSales += sales;
            grandWithoutVat += withoutVat;
            grandCost += cost;
            grandQty += qty;

            if (!groupMap[group]) {
                groupMap[group] = { totalSales: 0, totalWithoutVat: 0, totalCost: 0, totalQty: 0, genders: { Man: {}, Woman: {}, Unisex: {} } };
            }

            groupMap[group].totalSales += sales;
            groupMap[group].totalWithoutVat += withoutVat;
            groupMap[group].totalCost += cost;
            groupMap[group].totalQty += qty;

            if (!groupMap[group].genders[genderKey][supplier]) {
                groupMap[group].genders[genderKey][supplier] = { sales: 0, withoutVat: 0, cost: 0, qty: 0 };
            }
            groupMap[group].genders[genderKey][supplier].sales += sales;
            groupMap[group].genders[genderKey][supplier].withoutVat += withoutVat;
            groupMap[group].genders[genderKey][supplier].cost += cost;
            groupMap[group].genders[genderKey][supplier].qty += qty;
        });

        // 🎯 تم التعديل هنا: (بدون الضريبة - التكلفة) / بدون الضريبة
        const grandMargin = grandWithoutVat > 0 ? ((grandWithoutVat - grandCost) / grandWithoutVat) * 100 : 0;

        document.getElementById('kpiTotalSales').textContent = grandSales.toLocaleString('en-US', { minimumFractionDigits: 2 }) + ' SAR';
        document.getElementById('kpiWithoutVat').textContent = grandWithoutVat.toLocaleString('en-US', { minimumFractionDigits: 2 }) + ' SAR';
        document.getElementById('kpiTotalCost').textContent = grandCost.toLocaleString('en-US', { minimumFractionDigits: 2 }) + ' SAR';
        document.getElementById('kpiMargin').textContent = grandMargin.toFixed(2) + '%';
        document.getElementById('kpiTotalQty').textContent = grandQty.toLocaleString('en-US') + ' Pcs';

        const container = document.getElementById('groupAnalyticsContainer');
        container.innerHTML = '';

        const sortedGroups = Object.keys(groupMap).sort((a, b) => groupMap[b].totalSales - groupMap[a].totalSales);

        if (sortedGroups.length === 0) {
            container.innerHTML = `<div class="status-msg">لا توجد مبيعات مسجلة في هذه الفترة</div>`;
            return;
        }

        sortedGroups.forEach(grp => {
            const gData = groupMap[grp];
            // 🎯 تعديل هامش المجموعة بناءً على المعادلة الجديدة
            const grpMargin = gData.totalWithoutVat > 0 ? ((gData.totalWithoutVat - gData.totalCost) / gData.totalWithoutVat) * 100 : 0;
            let gendersHTML = '';
            
            ['Man', 'Woman', 'Unisex'].forEach(gKey => {
                const supObj = gData.genders[gKey];
                const supKeys = Object.keys(supObj);
                
                if (supKeys.length > 0) {
                    let gLabelAr = gKey === 'Man' ? 'رجالي (Men)' : (gKey === 'Woman' ? 'نسائي (Women)' : 'مشترك (Unisex)');
                    let supTotalSales = Object.values(supObj).reduce((sum, i) => sum + i.sales, 0);
                    let supTotalWithoutVat = Object.values(supObj).reduce((sum, i) => sum + i.withoutVat, 0);
                    let supTotalCost = Object.values(supObj).reduce((sum, i) => sum + i.cost, 0);
                    let supTotalQty = Object.values(supObj).reduce((sum, i) => sum + i.qty, 0);
                    // 🎯 تعديل هامش الجنس بناءً على المعادلة الجديدة
                    let supMargin = supTotalWithoutVat > 0 ? ((supTotalWithoutVat - supTotalCost) / supTotalWithoutVat) * 100 : 0;
                    
                    let suppliersCardsHTML = '';
                    supKeys.sort((a, b) => supObj[b].sales - supObj[a].sales).forEach(sup => {
                        let rowData = supObj[sup];
                        // 🎯 تعديل هامش المورد بناءً على المعادلة الصحيحة الجديدة
                        let itemMargin = rowData.withoutVat > 0 ? ((rowData.withoutVat - rowData.cost) / rowData.withoutVat) * 100 : 0;
                        suppliersCardsHTML += `
                            <div class="supplier-item-card">
                                <div class="supplier-card-header">
                                    <span><i class="fa-solid fa-truck-fast" style="color:var(--accent); margin-left:4px;"></i> ${sup}</span>
                                    <span style="color:var(--accent); font-size:12px;">${rowData.sales.toLocaleString('en-US', { minimumFractionDigits: 2 })} SAR</span>
                                </div>
                                <div class="supplier-card-metrics">
                                    <div class="metric-cell m-cost">
                                        <label>التكلفة</label>
                                        <span>${rowData.cost.toLocaleString('en-US', { minimumFractionDigits: 2 })}</span>
                                    </div>
                                    <div class="metric-cell m-margin">
                                        <label>Margin</label>
                                        <span>${itemMargin.toFixed(2)}%</span>
                                    </div>
                                    <div class="metric-cell m-qty">
                                        <label>الكمية</label>
                                        <span>${rowData.qty} Pcs</span>
                                    </div>
                                </div>
                            </div>
                        `;
                    });

                    gendersHTML += `
                        <div class="gender-accordion">
                            <div class="gender-header ${gKey.toLowerCase()}" onclick="toggleGenderAccordion(this)">
                                <span><i class="fa-solid fa-user"></i> ${gLabelAr}</span>
                                <div style="display: flex; align-items: center; gap: 6px; flex-wrap:wrap;">
                                    <span style="font-size: 11px; font-weight: 700;">${supTotalSales.toLocaleString('en-US', { minimumFractionDigits: 2 })} SAR (Margin: ${supMargin.toFixed(2)}%)</span>
                                    <i class="fa-solid fa-chevron-down gender-chevron"></i>
                                </div>
                            </div>
                            <div class="gender-body">
                                <div class="suppliers-grid-box">
                                    ${suppliersCardsHTML}
                                </div>
                            </div>
                        </div>
                    `;
                }
            });

            container.innerHTML += `
                <div class="group-card">
                    <div class="group-header" onclick="toggleGroupAccordion(this)">
                        <div class="group-title-row">
                            <span><i class="fa-solid fa-folder" style="color: var(--accent); margin-left: 6px;"></i> ${grp}</span>
                            <span class="group-qty-badge">${gData.totalQty} Pcs</span>
                        </div>
                        <div class="group-totals-badge">
                            <span class="box-sales">
                                <label>إجمالي المبيعات</label>
                                <b>${gData.totalSales.toLocaleString('en-US', { minimumFractionDigits: 2 })} SAR</b>
                            </span>
                            <span class="box-novat">
                                <label>بدون ضريبة</label>
                                <b>${gData.totalWithoutVat.toLocaleString('en-US', { minimumFractionDigits: 2 })}</b>
                            </span>
                            <span class="box-cost">
                                <label>التكلفة</label>
                                <b>${gData.totalCost.toLocaleString('en-US', { minimumFractionDigits: 2 })}</b>
                            </span>
                            <span class="box-margin">
                                <label>Margin</label>
                                <b>${grpMargin.toFixed(2)}%</b>
                            </span>
                        </div>
                    </div>
                    <div class="group-body">${gendersHTML}</div>
                </div>
            `;
        });
    }

    function toggleGroupAccordion(headerEl) { headerEl.closest('.group-card').classList.toggle('open'); }
    function toggleGenderAccordion(headerEl) { headerEl.closest('.gender-accordion').classList.toggle('open'); }
</script>
</body>
</html>
