<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlRoot">
<head>
    <link rel="manifest" href="./manifest.json">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Almoosa Trading">

    <link rel="apple-touch-icon" sizes="180x180" href="https://raw.githubusercontent.com/Almoosa-Trading/Almoosa-APP/main/Almoosa%20App.png">
    <link rel="icon" type="image/png" sizes="32x32" href="https://raw.githubusercontent.com/Almoosa-Trading/Almoosa-APP/main/Almoosa%20App.png">
    <link rel="shortcut icon" href="https://raw.githubusercontent.com/Almoosa-Trading/Almoosa-APP/main/Almoosa%20App.png">

    <title data-i18n="main_title">لوحة التحكم الاحترافية - الموسى التجارية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="style.css?v=2026.5">
    <script src="app.js" defer></script>

    <style>
        .dashboard-container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 10px;
        }

        /* 📱 هيدر مرتب وصارم يمنع تمدد الأزرار */
        header {
            display: flex !important;
            flex-direction: row !important;
            justify-content: space-between !important;
            align-items: center !important;
            flex-wrap: nowrap !important;
            gap: 6px !important;
            margin-bottom: 15px !important;
            padding: 12px 14px !important;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0284c7 100%) !important;
            color: #ffffff !important;
            border-radius: 14px !important;
            box-shadow: 0 8px 20px -4px rgba(2, 132, 199, 0.2);
            border: 2px solid #38bdf8 !important;
        }

        .header-title-box {
            flex: 1 1 auto !important;
            min-width: 0 !important;
        }

        .header-title-box h1 {
            font-size: 14px !important;
            color: #ffffff !important;
            font-weight: 800;
            white-space: nowrap !important;
            overflow: hidden !important;
            text-overflow: ellipsis !important;
            margin: 0 !important;
        }

        .header-title-box p {
            font-size: 9.5px !important;
            color: #bae6fd !important;
            margin: 0 !important;
            font-weight: 600;
            white-space: nowrap !important;
            overflow: hidden !important;
            text-overflow: ellipsis !important;
        }

        .header-left-group {
            display: flex !important;
            flex-direction: row !important;
            align-items: center !important;
            flex-wrap: nowrap !important;
            gap: 4px !important;
            flex-shrink: 0 !important;
            width: auto !important;
        }

        /* إعطاء أبعاد ثابتة وصغيرة تمنع تمدد أزرار الهيدر تحت أي ظرف */
        .header-left-group .action-btn-icon {
            background: rgba(255, 255, 255, 0.15) !important;
            border: 1.5px solid rgba(255, 255, 255, 0.3) !important;
            width: 32px !important;
            height: 32px !important;
            min-width: 32px !important;
            max-width: 32px !important;
            border-radius: 8px !important;
            cursor: pointer;
            font-size: 13px !important;
            color: #ffffff !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            padding: 0 !important;
            margin: 0 !important;
            flex-shrink: 0 !important;
        }

        .header-left-group .lang-select {
            background: rgba(255, 255, 255, 0.15) !important;
            border: 1.5px solid rgba(255, 255, 255, 0.3) !important;
            padding: 0 4px !important;
            border-radius: 8px !important;
            font-size: 10px !important;
            font-weight: 700;
            color: #ffffff !important;
            height: 32px !important;
            outline: none;
            margin: 0 !important;
            flex-shrink: 0 !important;
            width: auto !important;
        }

        .lang-select option {
            background: #1e293b;
            color: #ffffff;
        }

        /* 🎴 شبكة أودو المصغرة */
        .odoo-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 14px;
            padding: 5px 0;
        }

        @media (min-width: 640px) {
            .odoo-grid { grid-template-columns: repeat(4, 1fr); gap: 20px; }
        }

        @media (min-width: 900px) {
            .odoo-grid { grid-template-columns: repeat(6, 1fr); gap: 24px; }
        }

        .odoo-app-card {
            background: transparent;
            border: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            text-decoration: none;
            color: var(--text-main);
            transition: transform 0.2s ease;
            position: relative;
            cursor: pointer;
            padding: 6px;
        }

        .odoo-app-card:hover:not(.disabled) {
            transform: translateY(-4px);
        }

        .odoo-app-card.disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }

        .odoo-icon-box {
            width: 58px;
            height: 58px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            margin-bottom: 6px;
            box-shadow: 0 6px 16px rgba(0,0,0,0.08);
        }

        .ic-sales { background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%); color: white; }
        .ic-purchase-analytics { background: linear-gradient(135deg, #10b981 0%, #047857 100%); color: white; }
        .ic-warehouse { background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); color: white; }
        
        .ic-stock, .ic-purchase, .ic-transfer, .ic-receive, .ic-contract, .ic-water, .ic-electricity {
            background: var(--bg-card); 
            color: var(--text-muted); 
            border: 1.5px solid var(--border);
        }

        .odoo-title {
            font-size: 11.5px;
            font-weight: 800;
            color: var(--text-main);
        }

        .badge-orange {
            position: absolute;
            top: 0;
            right: calc(50% - 28px);
            background: #f59e0b;
            color: white;
            font-size: 8px;
            font-weight: 850;
            padding: 1px 4px;
            border-radius: 4px;
            z-index: 2;
        }
    </style>
</head>
<body data-theme="light">

<div class="dashboard-container">
    <header>
        <div class="header-title-box">
            <h1 data-i18n="dash_header">لوحة التحكم</h1>
            <p data-i18n="dash_subheader">النظام الإداري الموحد - الموسى التجارية</p>
        </div>
        <div class="header-left-group">
            <!-- أضفنا الكلاس action-btn-icon هنا لضمان بقائها صغيرة وعدم تمددها -->
            <button class="action-btn-icon" id="themeToggleBtn" onclick="toggleTheme()" title="تغيير المظهر">
                <i class="fa-solid fa-moon" id="themeIcon"></i>
            </button>
            <button class="action-btn-icon" onclick="checkForUpdates(this)" title="تحميل التحديثات الأخيرة">
                <i class="fa-solid fa-rotate"></i>
            </button>
            <select id="langSelect" class="lang-select" onchange="changeLanguage(this.value)">
                <option value="ar">العربية</option>
                <option value="en">English</option>
                <option value="hi">हिन्दी</option>
                <option value="ur">اردو</option>
            </select>
        </div>
    </header>

    <div class="odoo-grid">
        <a href="sales.html" class="odoo-app-card">
            <div class="odoo-icon-box ic-sales"><i class="fa-solid fa-chart-line"></i></div>
            <div class="odoo-title" data-i18n="menu_sales">المبيعات</div>
        </a>

        <a href="purchases.html" class="odoo-app-card">
            <div class="odoo-icon-box ic-purchase-analytics"><i class="fa-solid fa-chart-pie"></i></div>
            <div class="odoo-title" data-i18n="menu_purchases_analysis">تحليل المشتريات</div>
        </a>

        <a href="warehouse.html" class="odoo-app-card">
            <div class="odoo-icon-box ic-warehouse"><i class="fa-solid fa-warehouse"></i></div>
            <div class="odoo-title" data-i18n="menu_warehouse">إدارة المستودع</div>
        </a>

        <div class="odoo-app-card disabled">
            <span class="badge-orange" data-i18n="under_construction">قريباً</span>
            <div class="odoo-icon-box ic-stock"><i class="fa-solid fa-boxes-stacked"></i></div>
            <div class="odoo-title" data-i18n="menu_stock">المخزون</div>
        </div>

        <div class="odoo-app-card disabled">
            <span class="badge-orange" data-i18n="under_construction">قريباً</span>
            <div class="odoo-icon-box ic-purchase"><i class="fa-solid fa-cart-shopping"></i></div>
            <div class="odoo-title" data-i18n="menu_purchases">المشتريات</div>
        </div>

        <div class="odoo-app-card disabled">
            <span class="badge-orange" data-i18n="under_construction">قريباً</span>
            <div class="odoo-icon-box ic-transfer"><i class="fa-solid fa-right-left"></i></div>
            <div class="odoo-title" data-i18n="menu_transfers">التحويلات</div>
        </div>

        <div class="odoo-app-card disabled">
            <span class="badge-orange" data-i18n="under_construction">قريباً</span>
            <div class="odoo-icon-box ic-receive"><i class="fa-solid fa-box-open"></i></div>
            <div class="odoo-title" data-i18n="menu_receipts">الاستلامات</div>
        </div>

        <div class="odoo-app-card disabled">
            <span class="badge-orange" data-i18n="under_construction">قريباً</span>
            <div class="odoo-icon-box ic-contract"><i class="fa-solid fa-file-contract"></i></div>
            <div class="odoo-title" data-i18n="menu_contracts">عقود الإيجار</div>
        </div>

        <div class="odoo-app-card disabled">
            <span class="badge-orange" data-i18n="under_construction">قريباً</span>
            <div class="odoo-icon-box ic-water"><i class="fa-solid fa-droplet"></i></div>
            <div class="odoo-title" data-i18n="menu_water">فواتير المياه</div>
        </div>

        <div class="odoo-app-card disabled">
            <span class="badge-orange" data-i18n="under_construction">قريباً</span>
            <div class="odoo-icon-box ic-electricity"><i class="fa-solid fa-bolt"></i></div>
            <div class="odoo-title" data-i18n="menu_electricity">فواتير الكهرباء</div>
        </div>
    </div>

    <footer data-i18n="footer_text" style="text-align: center; margin-top: 30px; font-size: 11px; font-weight: 700; color: var(--text-muted);">
        نظام الموسى التجارية الاحترافي © 2026
    </footer>
</div>

</body>
</html>
